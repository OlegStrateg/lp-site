        }

            border: 1px solid rgba(255, 255, 255, 0.4);
        }
        .mesh-gradient {
            background: radial-gradient(at 0% 0%, rgba(74, 50, 203, 0.08) 0px, transparent 50%),
                        radial-gradient(at 100% 0%, rgba(166, 80, 0, 0.04) 0px, transparent 50%),
                        radial-gradient(at 50% 100%, rgba(99, 79, 228, 0.06) 0px, transparent 50%);
        }

        /* Precise Cursor Animation - Total 10s cycle */
        @keyframes cursorMovement {
            0%, 5% { transform: translate(450px, 300px); opacity: 0; } /* Start hidden */
            10% { opacity: 1; }
            25% { transform: translate(726px, 94px); } /* To Puzzle Icon Center (Precise) */
            38% { transform: translate(726px, 94px); } /* Wait before click */
            40% { transform: translate(726px, 94px) scale(0.85); } /* Click Puzzle */
            42% { transform: translate(726px, 94px) scale(1); }
            55% { transform: translate(788px, 245px); } /* Move to Pin Icon Center (Precise) */
            68% { transform: translate(788px, 245px); } /* Wait before click */
            70% { transform: translate(788px, 245px) scale(0.85); } /* Click Pin */
            72% { transform: translate(788px, 245px) scale(1); }
            90% { transform: translate(788px, 245px); opacity: 1; } /* Stop and hold */
            100% { transform: translate(788px, 245px); opacity: 0; } /* Fade out for loop */
        }

        .cursor-active {
            animation: cursorMovement 10s infinite cubic-bezier(0.4, 0, 0.2, 1);
        }

        @keyframes pulse-ring {
            0% { transform: scale(0.6); opacity: 0; }
            50% { transform: scale(1.1); opacity: 0.6; }
            100% { transform: scale(1.4); opacity: 0; }
        }

        .pulse-layer::after {
            content: '';
            position: absolute;
            inset: -6px;
            border: 2px solid #4a32cb;
            border-radius: 50%;
            animation: pulse-ring 1.5s infinite;
        }

        .dropdown-transition {
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            transform-origin: top right;
        }

        @keyframes click-ripple {
            0% { transform: scale(1); opacity: 0.5; }
            100% { transform: scale(4); opacity: 0; }
        }
        .ripple-effect {
            position: absolute;
            width: 10px;
            height: 10px;
            background: rgba(74, 50, 203, 0.4);
            border-radius: 50%;
            pointer-events: none;
            animation: click-ripple 0.6s ease-out forwards;
        }


        /* Правка 3: оформление подтверждения установки — только заголовок */
        .installation-heading {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
        }

        .installation-success-icon {
            position: relative;
            width: 52px;
            height: 52px;
            flex: 0 0 52px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 9999px;
            color: #ffffff;
            background: linear-gradient(145deg, #725eea 0%, #4a32cb 100%);
            box-shadow: 0 10px 24px rgba(74, 50, 203, 0.24);
            animation: installationIconIn 700ms cubic-bezier(0.16, 1, 0.3, 1) both;
        }

        .installation-success-icon::after {
            content: '';
            position: absolute;
            inset: -7px;
            border: 2px solid rgba(74, 50, 203, 0.34);
            border-radius: inherit;
            animation: installationRing 700ms ease-out both;
        }

        .installation-success-icon svg {
            width: 27px;
            height: 27px;
            display: block;
        }

        .installation-heading-text {
            display: inline-block;
            animation: installationTextIn 700ms 90ms cubic-bezier(0.16, 1, 0.3, 1) both;
        }

        @keyframes installationIconIn {
            0% { opacity: 0; transform: scale(0.75); }
            70% { opacity: 1; transform: scale(1.06); }
            100% { opacity: 1; transform: scale(1); }
        }

        @keyframes installationRing {
            0% { opacity: 0; transform: scale(0.72); }
            35% { opacity: 0.55; }
            100% { opacity: 0; transform: scale(1.42); }
        }

        @keyframes installationTextIn {
            0% { opacity: 0; transform: translateY(8px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 640px) {
            .installation-heading {
                gap: 10px;
            }

            .installation-success-icon {
                width: 44px;
                height: 44px;
                flex-basis: 44px;
            }

            .installation-success-icon svg {
                width: 23px;
                height: 23px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .installation-success-icon,
            .installation-success-icon::after,
            .installation-heading-text {
                animation: none !important;
            }
        }

    
        /* Служебный статус открытия панели: скрыт до результата нажатия. */
        .open-panel-status {

window.updateResponsiveBrowserScale = function updateResponsiveBrowserScale() {
    var shell = document.getElementById('browser-scale-shell');
    if (!shell) return;
    var bodyStyles = window.getComputedStyle(document.body);
    var horizontalPadding =
        parseFloat(bodyStyles.paddingLeft || '0')
        + parseFloat(bodyStyles.paddingRight || '0');
    var availableWidth = Math.max(
        260,
        document.documentElement.clientWidth - horizontalPadding
    );
    var scale = Math.min(1, availableWidth / 900);
    shell.style.setProperty('--browser-scale', String(Math.max(0.28, scale)));
};
window.updateResponsiveBrowserScale();
</script>

        function detectLocale() {
            const supportedLocales = new Set([
                'en', 'ru', 'es', 'de', 'fr', 'pt', 'it', 'pl',
                'tr', 'uk', 'ja', 'ko', 'zh-Hans', 'zh-Hant', 'hi',
                'nl', 'sv', 'da', 'no', 'fi', 'ar', 'id', 'fil', 'vi', 'th'
            ]);

            function normalizeLocale(language) {
                const value = String(language || '').trim();
                if (!value) return null;

                const normalized = value.replace('_', '-');
                const lower = normalized.toLowerCase();

                if (
                    lower === 'zh-tw' ||
                    lower === 'zh-hk' ||
                    lower === 'zh-mo' ||
                    lower.startsWith('zh-hant')
                ) {
                    return 'zh-Hant';
                }

                if (
                    lower === 'zh-cn' ||
                    lower === 'zh-sg' ||
                    lower.startsWith('zh-hans') ||
                    lower === 'zh'
                ) {
                    return 'zh-Hans';
                }

                const base = lower.split('-')[0];

                if (base === 'nb' || base === 'nn') {
                    return 'no';
                }

                if (base === 'tl') {
                    return 'fil';
                }

                return supportedLocales.has(base) ? base : null;
            }

            const forcedLocale = new URLSearchParams(window.location.search).get('lang');
            const normalizedForcedLocale = normalizeLocale(forcedLocale);

            if (normalizedForcedLocale) {
                return normalizedForcedLocale;
            }

            const browserLanguages =
                Array.isArray(navigator.languages) && navigator.languages.length
                    ? navigator.languages
                    : [navigator.language || 'en'];

            for (const language of browserLanguages) {
                const locale = normalizeLocale(language);
                if (locale) return locale;
            }

            return 'en';
        }

        const currentLocale = detectLocale();
        const copy = translations[currentLocale];

        document.documentElement.lang = currentLocale;
        document.documentElement.dataset.locale = currentLocale;
        document.title = copy.pageTitle;

        const isRtlLocale = currentLocale === 'ar';

        const localizedElements = {
            'installation-heading-text': copy.installationHeading,
            'installation-subtitle': copy.installationSubtitle,
            'browser-tab-text': copy.browserTab,
            'hint-extensions-text': copy.hintExtensions,
            'hint-pin-text': copy.hintPin,
            'extensions-menu-title': copy.extensionsTitle,
            'extensions-access-text': copy.noAccess,
            'manage-extensions-text': copy.manageExtensions,
            'btn-text': copy.openButton
        };

        Object.entries(localizedElements).forEach(([id, text]) => {
            const element = document.getElementById(id);
            if (!element) return;

            element.textContent = text;
            element.lang = currentLocale;

            if (isRtlLocale) {
                element.classList.add('localized-rtl');
                element.dir = 'rtl';
            } else {
                element.classList.remove('localized-rtl');
                element.dir = 'ltr';
            }
        });

        const puzzlePulse = document.getElementById('puzzle-pulse');
        const puzzleRipple = document.getElementById('puzzle-ripple-container');
        const dropdown = document.getElementById('mock-dropdown');
        const pinIcon = document.getElementById('pin-icon');
        const pinPulse = document.getElementById('pin-pulse');
        const pinRipple = document.getElementById('pin-ripple-container');
        const finalBtn = document.getElementById('final-btn');
        const btnText = document.getElementById('btn-text');
        const btnIcon = document.getElementById('btn-icon');
        const extensionRow = document.getElementById('extension-row');
        const hint1 = document.getElementById('hint-1');
        const hint2 = document.getElementById('hint-2');
        const openPanelStatus = document.getElementById('open-panel-status');

        const welcomeSource =
            new URLSearchParams(window.location.search).get('source') === 'install'
                ? 'install'
                : 'direct';

        const welcomeEvents = [];
        window.__pictureConverterWelcomeEvents = welcomeEvents;
        window.dataLayer = window.dataLayer || [];

        function trackWelcomeEvent(eventName, properties = {}) {
            const event = {
                event: eventName,
                source: welcomeSource,
                locale: currentLocale,
                ...properties,
                timestamp: Date.now()
            };

            welcomeEvents.push(event);
            window.dataLayer.push(event);

            window.dispatchEvent(
                new CustomEvent('picture-converter:analytics', {
                    detail: event
                })
            );
        }

        trackWelcomeEvent('welcome_view');

        // --- install analytics ---
        const installSid = crypto.randomUUID();
        let installPanelOpened = false;

        function postInstall(phase) {
            const payload = JSON.stringify({
                p: 'ic',
                sid: installSid,
                phase,
                locale: currentLocale,
            });
            if (navigator.sendBeacon) {
                navigator.sendBeacon('/api/install', new Blob([payload], { type: 'application/json' }));
            } else {
                fetch('/api/install', { method: 'POST', body: payload,
                    headers: { 'content-type': 'application/json' }, keepalive: true }).catch(() => {});
            }
        }

        postInstall('open');

        window.addEventListener('pagehide', () => {
            if (!installPanelOpened) postInstall('abandoned');
        });
        // --- end install analytics ---

        let hasCompletedOnce = false;

        function createRipple(container) {
            const ripple = document.createElement('div');
            ripple.className = 'ripple-effect';
            container.appendChild(ripple);
            setTimeout(() => ripple.remove(), 600);
        }

        function runAnimationCycle() {
            // Reset state
            dropdown.style.opacity = '0';
            dropdown.style.transform = 'scale(0.95) translateY(-10px)';
            dropdown.style.pointerEvents = 'none';
            
            puzzlePulse.classList.add('hidden');
            pinPulse.classList.add('hidden');
            
            pinIcon.style.fontVariationSettings = "'FILL' 0";
            pinIcon.classList.remove('text-primary');
            pinIcon.classList.add('text-gray-400');
            
            extensionRow.classList.remove('bg-primary/5');
            
            hint1.classList.replace('opacity-100', 'opacity-0');
            hint1.classList.replace('scale-100', 'scale-90');
            hint2.classList.replace('opacity-100', 'opacity-0');
            hint2.classList.replace('scale-100', 'scale-90');

            // 1. Move to puzzle icon & Show Hint 1 (Sync with 2.5s marker)
            setTimeout(() => {
                puzzlePulse.classList.remove('hidden');
                hint1.classList.replace('opacity-0', 'opacity-100');
                hint1.classList.replace('scale-90', 'scale-100');
            }, 2500);

            // 2. Click Puzzle (Sync with 4s marker)
            setTimeout(() => {
                puzzlePulse.classList.add('hidden');
                createRipple(puzzleRipple);
                dropdown.style.opacity = '1';
                dropdown.style.transform = 'scale(1) translateY(0)';
                dropdown.style.pointerEvents = 'auto';
                
                // Hide Hint 1
                hint1.classList.replace('opacity-100', 'opacity-0');
                hint1.classList.replace('scale-100', 'scale-90');
            }, 4000);

            // 3. Move to pin icon & Show Hint 2 (Sync with 5.5s marker)
            setTimeout(() => {
                extensionRow.classList.add('bg-primary/5');
                pinPulse.classList.remove('hidden');
                hint2.classList.replace('opacity-0', 'opacity-100');
                hint2.classList.replace('scale-90', 'scale-100');
            }, 5500);

            // 4. Click Pin (Sync with 7s marker)
            setTimeout(() => {
                pinPulse.classList.add('hidden');
                createRipple(pinRipple);
                pinIcon.style.fontVariationSettings = "'FILL' 1";
                pinIcon.classList.remove('text-gray-400');
                pinIcon.classList.add('text-primary');
            }, 7000);

            // 5. Cleanup Success State (Sync with 9s marker)
            setTimeout(() => {
                hint2.classList.replace('opacity-100', 'opacity-0');
                hint2.classList.replace('scale-100', 'scale-90');
                if (!hasCompletedOnce) {
                    unlockButton();
                    hasCompletedOnce = true;
                }
            }, 9000);
        }

        function unlockButton() {
            finalBtn.disabled = false;
            finalBtn.classList.remove('bg-surface-container-highest', 'text-on-surface-variant', 'cursor-not-allowed');
            finalBtn.classList.add('bg-primary', 'text-on-primary', 'shadow-xl', 'shadow-primary/25', 'hover:brightness-110', 'active:scale-95');
            btnText.innerText = copy.openButton;
            btnIcon.innerText = 'check_circle';
            btnIcon.classList.add('animate-pulse');
        }

        runAnimationCycle();
        setInterval(runAnimationCycle, 10000);

        const PAGE_MESSAGE_SOURCE = 'picture-converter-welcome-page';
        const EXTENSION_MESSAGE_SOURCE = 'picture-converter-extension';
        const OPEN_PANEL_REQUEST = 'PICTURE_CONVERTER_OPEN_PANEL';
        const OPEN_PANEL_RESULT = 'PICTURE_CONVERTER_OPEN_PANEL_RESULT';
        const OPEN_TIMEOUT_MS = 7000;

        let pendingOpenRequestId = null;
        let openTimeoutId = null;

        function createRequestId() {
            if (crypto?.randomUUID) return crypto.randomUUID();

            return [
                Date.now().toString(36),
                Math.random().toString(36).slice(2)
            ].join('-');
        }

        function resetOpenButton() {
            finalBtn.disabled = false;
            finalBtn.removeAttribute('aria-busy');
            btnText.textContent = copy.openButton;
            btnIcon.textContent = 'check_circle';
            btnIcon.classList.remove('animate-spin');
            btnIcon.classList.add('animate-pulse');
        }

        function showOpenStatus(message, state) {
            openPanelStatus.textContent = message;
            openPanelStatus.dataset.state = state;
            openPanelStatus.hidden = !message;

            if (isRtlLocale) {
                openPanelStatus.classList.add('localized-rtl');
                openPanelStatus.dir = 'rtl';
            } else {
                openPanelStatus.classList.remove('localized-rtl');
                openPanelStatus.dir = 'ltr';
            }
        }

        function failOpenPanel(reason) {
            if (openTimeoutId) {
                clearTimeout(openTimeoutId);
                openTimeoutId = null;
            }

            trackWelcomeEvent('welcome_open_error', {
                reason
            });

            pendingOpenRequestId = null;
            delete finalBtn.dataset.openRequestId;
            showOpenStatus(copy.openError, 'error');
            resetOpenButton();
        }

        finalBtn.addEventListener('click', () => {
            if (finalBtn.disabled || pendingOpenRequestId) return;

            pendingOpenRequestId = createRequestId();
            finalBtn.dataset.openRequestId = pendingOpenRequestId;

            trackWelcomeEvent('welcome_open_click');

            finalBtn.disabled = true;
            finalBtn.setAttribute('aria-busy', 'true');
            btnText.textContent = copy.opening;
            btnIcon.textContent = 'sync';
            btnIcon.classList.remove('animate-pulse');
            btnIcon.classList.add('animate-spin');
            showOpenStatus('', '');

            const targetOrigin =
                window.location.origin === 'null'
                    ? '*'
                    : window.location.origin;

            window.postMessage(
                {
                    source: PAGE_MESSAGE_SOURCE,
                    type: OPEN_PANEL_REQUEST,
                    requestId: pendingOpenRequestId,
                    locale: currentLocale
                },
                targetOrigin
            );

            openTimeoutId = window.setTimeout(() => {
                failOpenPanel('extension_bridge_timeout');
            }, OPEN_TIMEOUT_MS);
        });

        window.addEventListener('message', (event) => {
            if (event.source !== window) return;

            if (
                window.location.origin !== 'null'
                && event.origin !== window.location.origin
            ) {
                return;
            }

            const data = event.data;

            if (
                data?.source !== EXTENSION_MESSAGE_SOURCE
                || data?.type !== OPEN_PANEL_RESULT
                || data?.requestId !== pendingOpenRequestId
            ) {
                return;
            }

            if (openTimeoutId) {
                clearTimeout(openTimeoutId);
                openTimeoutId = null;
            }

            if (data.ok !== true) {
                failOpenPanel(
                    typeof data.error === 'string'
                        ? data.error.slice(0, 64)
                        : 'side_panel_open_failed'
                );
                return;
            }

            trackWelcomeEvent('welcome_open_success');
            installPanelOpened = true;
            postInstall('panel_opened');

            pendingOpenRequestId = null;
            delete finalBtn.dataset.openRequestId;
            finalBtn.disabled = true;
            finalBtn.removeAttribute('aria-busy');
            btnText.textContent = copy.readyMessage;
            btnIcon.textContent = 'check_circle';
            btnIcon.classList.remove('animate-spin', 'animate-pulse');
            showOpenStatus('', 'success');
        });
    
        window.addEventListener(
            'resize',
            window.updateResponsiveBrowserScale,
            { passive: true }
        );

        window.addEventListener(
            'orientationchange',
            window.updateResponsiveBrowserScale,
            { passive: true }
        );

    </script>
