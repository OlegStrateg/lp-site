name: Modern Instagram public source lab

on:
  push:
    branches:
      - lab/vendor-trend-tools-smoke
    paths:
      - '.github/workflows/modern-instagram-public.yml'
  workflow_dispatch:

jobs:
  hindsight_vogue:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Fetch exact upstream
        run: |
          git clone https://github.com/gautham-fyi/instagram-hindsight.git tool
          git -C tool checkout 864181a041fa8240c4bc108a65b3185513ce58c9
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install original tool unchanged
        run: python -m pip install -e tool >/dev/null
      - name: Scrape public Vogue guest session
        shell: bash
        run: |
          set +e
          timeout 120s instagram-hindsight vogue --max-pages 1 -o /tmp/vogue.json -v > /tmp/hindsight.log 2>&1
          RC=$?
          set -e
          cat /tmp/hindsight.log
          echo "runtime_exit=$RC"
          if test -s /tmp/vogue.json; then
            python - <<'PY'
          import json
          d=json.load(open("/tmp/vogue.json"))
          p=d.get("profile") or {}
          posts=d.get("posts") or []
          reels=d.get("reels") or []
          print("username=",p.get("username"))
          print("followers=",p.get("followers_count"))
          print("posts_count=",len(posts))
          print("reels_count=",len(reels))
          for x in (reels+posts)[:5]:
              print("MEDIA",x.get("shortcode"),x.get("link"),x.get("likes"),x.get("comments"),x.get("views"))
          PY
          fi
          test "$RC" -eq 0
