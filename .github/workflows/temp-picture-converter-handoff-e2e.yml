name: Picture Converter Handoff E2E
on:
  push:
    branches:
      - test/picture-converter-handoff-e2e-2026-09-18

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: stable
      - run: "$CHROME_PATH" --version
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
      - run: sudo -E "$(command -v node)" _internal/e2e/picture-converter/run-e2e.mjs
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
          LP_TEST_LANG: en
