name: Deploy LayerPorter to Cloudflare Pages

on:
  workflow_dispatch:
  push:
    branches:
      - master

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Inspect Cloudflare Pages project
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npx wrangler@3.90.0 pages project list
          echo "=== PRODUCTION DEPLOYMENTS ==="
          npx wrangler@3.90.0 pages deployment list --project-name=layerporter --environment=production
          echo "=== PREVIEW DEPLOYMENTS ==="
          npx wrangler@3.90.0 pages deployment list --project-name=layerporter --environment=preview

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=layerporter --branch=main --commit-hash=${{ github.sha }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy Pinterest queue worker
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx wrangler@3.90.0 deploy --config wrangler-pinterest-worker.toml
          echo "Pinterest queue Worker deployed"

      - name: Verify all 52 Pinterest landings
        shell: bash
        run: |
          set -euo pipefail

          BASE="https://layerporter.com"
          EN_URL="$BASE/pinterest-downloader/?verify=${{ github.sha }}"

          # Wait until the just-deployed revision reaches production.
          for i in {1..24}; do
            if curl -fsS --max-time 20 -A "Mozilla/5.0" "$EN_URL" -o /tmp/pinterest-en.html \
              && grep -Fq 'name="lp-locale" content="en"' /tmp/pinterest-en.html \
              && grep -Fq 'id="privacyConsent"' /tmp/pinterest-en.html \
              && grep -Fq 'lp_pd_attr' /tmp/pinterest-en.html; then
              echo "Current Pinterest attribution build is live"
              break
            fi
            if [ "$i" -eq 24 ]; then
              echo "Current locale build did not propagate"
              exit 1
            fi
            sleep 5
          done

          # Base visual/motion assets and Store attribution.
          grep -F "nmpahchhmcdejmfcmkphnbhckmlhhnon" /tmp/pinterest-en.html
          grep -F "utm_content=header" /tmp/pinterest-en.html
          grep -F "utm_content=hero" /tmp/pinterest-en.html
          grep -F "utm_content=final" /tmp/pinterest-en.html
          grep -F "utm_content=mobile_sticky" /tmp/pinterest-en.html
          grep -F "images.unsplash.com" /tmp/pinterest-en.html

          : > /tmp/pinterest.styles.css
          grep -oE 'href="[^"]+\.css"' /tmp/pinterest-en.html | sed 's/^href="//;s/"$//' | sort -u | while read -r href; do
            if [[ "$href" == http* ]]; then
              css_url="$href"
            else
              css_url="$BASE$href"
            fi
            curl -fsS --max-time 20 -A "Mozilla/5.0" "$css_url" >> /tmp/pinterest.styles.css
          done
          grep -F "@keyframes ctaSweep" /tmp/pinterest.styles.css

          # Static manifest created by the same build must contain 52 locales.
          node - <<'NODE'
          const fs = require('fs');
          const rows = JSON.parse(fs.readFileSync('dist/pinterest-locales.json', 'utf8'));
          if (rows.length !== 52) throw new Error('Expected 52 locales, got ' + rows.length);
          const hold = rows.filter(x => x.hold).map(x => x.code);
          const expectedHold = ['am','fil','ml','sl','sw','ta','te'];
          if (JSON.stringify(hold) !== JSON.stringify(expectedHold)) {
            throw new Error('Unexpected HOLD set: ' + JSON.stringify(hold));
          }
          console.log('Build manifest: 52/52; research HOLD but indexed:', hold.join(', '));
          NODE

          # Every locale must be live, self-attributed and indexable.
          ok=0
          while IFS=$'\t' read -r code route status; do
            if [ "$code" = "en" ]; then
              path="/pinterest-downloader/"
            else
              path="/$route/pinterest-downloader/"
            fi
            url="$BASE$path?verify=${{ github.sha }}"
            tmp="/tmp/pinterest-$code.html"

            passed=0
            for attempt in {1..6}; do
              if curl -fsS --max-time 20 -A "Mozilla/5.0" "$url" -o "$tmp" \
                && grep -Fq "name=\"lp-locale\" content=\"$code\"" "$tmp" \
                && grep -Fq "utm_term=$code" "$tmp"; then
                passed=1
                break
              fi
              sleep 3
            done

            if [ "$passed" -ne 1 ]; then
              echo "FAILED locale: $code -> $path"
              exit 1
            fi

            grep -Fq 'meta name="robots" content="index,follow"' "$tmp"
            grep -Fq 'hreflang="x-default"' "$tmp"
            grep -Fq "nmpahchhmcdejmfcmkphnbhckmlhhnon" "$tmp"
            ok=$((ok+1))
            echo "OK $code $status $path"
          done < dist/pinterest-locales.tsv

          if [ "$ok" -ne 52 ]; then
            echo "Expected 52 live locales, got $ok"
            exit 1
          fi

          # Scoped CSP must work on EN and representative localized paths.
          for path in "/pinterest-downloader/" "/es/pinterest-downloader/" "/ar/pinterest-downloader/" "/zh-cn/pinterest-downloader/"; do
            curl -fsSI --max-time 20 -A "Mozilla/5.0" "$BASE$path" -o /tmp/pinterest.headers
            grep -i "content-security-policy:" /tmp/pinterest.headers | grep -F "https://images.unsplash.com"
            grep -i "content-security-policy:" /tmp/pinterest.headers | grep -F "script-src 'self' 'unsafe-inline'"
          done

          curl -fsS --max-time 20 -A "Mozilla/5.0" "$BASE/sitemap.xml?verify=${{ github.sha }}" -o /tmp/sitemap.xml
          node - <<'NODE'
          const fs = require('fs');
          const xml = fs.readFileSync('/tmp/sitemap.xml','utf8');
          const rows = JSON.parse(fs.readFileSync('dist/pinterest-locales.json','utf8'));
          for (const row of rows) {
            if (!xml.includes('<loc>' + row.url + '</loc>')) {
              throw new Error('Missing sitemap URL: ' + row.url);
            }
          }
          console.log('Sitemap PASS: 52/52 locale URLs');
          NODE

          echo "=== VERIFY ATTRIBUTION + PRIVACY ==="
          grep -F 'id="privacyConsent"' /tmp/pinterest-en.html
          grep -F "lp_pd_attr" /tmp/pinterest-en.html
          grep -F "lp_privacy" /tmp/pinterest-en.html
          grep -F "globalPrivacyControl" /tmp/pinterest-en.html
          grep -F 'href="/privacy/#cookies"' /tmp/pinterest-en.html

          curl -fsS --max-time 20 -A "Mozilla/5.0" "$BASE/pinterest-downloader/welcome/?verify=${{ github.sha }}" -o /tmp/pinterest-welcome.html
          grep -F "const ATTR_COOKIE = 'lp_pd_attr'" /tmp/pinterest-welcome.html
          grep -F "body.attribution = landingAttribution" /tmp/pinterest-welcome.html
          grep -F "readCookie('lp_privacy') !== 'analytics:1'" /tmp/pinterest-welcome.html
          grep -F "webvisor:false" /tmp/pinterest-welcome.html
          grep -F "clickmap:false" /tmp/pinterest-welcome.html

          curl -fsS --max-time 20 -A "Mozilla/5.0" "$BASE/privacy/?verify=${{ github.sha }}" -o /tmp/privacy.html
          grep -F "lp_pd_attr" /tmp/privacy.html
          grep -F "Chrome Web Store Limited Use" /tmp/privacy.html
          grep -F "Reset privacy choices" /tmp/privacy.html

          echo "LIVE VERIFY PASS: 52/52 Pinterest landing URLs"

      - name: Verify Pinterest Automation preview noindex
        shell: bash
        run: |
          set -euo pipefail

          BASE="https://layerporter.com"
          URL="$BASE/internal/pinterest-automation/?verify=${{ github.sha }}"

          curl -fsS --max-time 20 -A "Mozilla/5.0" -D /tmp/pa.headers "$URL" -o /tmp/pa.html
          grep -F 'meta name="robots" content="noindex,nofollow,noarchive,nosnippet,noimageindex"' /tmp/pa.html
          grep -i '^x-robots-tag:' /tmp/pa.headers | grep -Ei 'noindex'
          grep -i '^cache-control:' /tmp/pa.headers | grep -Ei 'no-store'

          curl -fsS --max-time 20 -A "Mozilla/5.0" "$BASE/internal/pinterest-automation/styles.css?verify=${{ github.sha }}" -o /tmp/pa.css
          curl -fsS --max-time 20 -A "Mozilla/5.0" "$BASE/internal/pinterest-automation/app.js?verify=${{ github.sha }}" -o /tmp/pa.js
          curl -fsS --max-time 20 -A "Mozilla/5.0" "$BASE/internal/pinterest-automation/health?verify=${{ github.sha }}" -o /tmp/pa-health.json
          grep -F 'Pinterest Automation' /tmp/pa.html
          grep -F 'newDraftBtn' /tmp/pa.js
          grep -F '"ok":true' /tmp/pa-health.json
          grep -F '"livePublishing":false' /tmp/pa-health.json

          curl -fsS --max-time 20 -A "Mozilla/5.0" "$BASE/sitemap.xml?verify=${{ github.sha }}" -o /tmp/pa-sitemap.xml
          if grep -Fq '/internal/pinterest-automation/' /tmp/pa-sitemap.xml; then
            echo "Internal Pinterest Automation route must not be in sitemap"
            exit 1
          fi

          echo "Pinterest Automation preview PASS: live, assets OK, noindex, absent from sitemap"

      - name: Verify Pinterest Sandbox gateway locked
        shell: bash
        run: |
          set -euo pipefail

          BASE="https://layerporter.com/internal/pinterest-automation"

          curl -fsS --max-time 20 -A "Mozilla/5.0" "$BASE/health?verify=${{ github.sha }}" -o /tmp/pa-sandbox-health.json
          node -e '
            const fs = require("fs");
            const x = JSON.parse(fs.readFileSync("/tmp/pa-sandbox-health.json","utf8"));
            if (x.ok !== true) process.exit(1);
            if (x.mode !== "sandbox") process.exit(1);
            if (x.livePublishing !== false) process.exit(1);
            for (const k of ["sandboxConfigured","previewAuthConfigured","previewAuthenticated"]) {
              if (typeof x[k] !== "boolean") process.exit(1);
            }
          '

          curl -fsS --max-time 20 -A "Mozilla/5.0" "$BASE/auth/status?verify=${{ github.sha }}" -o /tmp/pa-auth.json
          node -e '
            const fs = require("fs");
            const x = JSON.parse(fs.readFileSync("/tmp/pa-auth.json","utf8"));
            if (x.ok !== true) process.exit(1);
            if (typeof x.configured !== "boolean" || typeof x.authenticated !== "boolean") process.exit(1);
          '

          STATUS="$(curl -sS -o /tmp/pa-boards.json -w "%{http_code}" --max-time 20 -A "Mozilla/5.0" "$BASE/api/boards?verify=${{ github.sha }}")"
          if [ "$STATUS" != "401" ] && [ "$STATUS" != "503" ]; then
            echo "Boards endpoint must stay locked without internal auth, got HTTP $STATUS"
            cat /tmp/pa-boards.json
            exit 1
          fi

          node -e '
            const fs = require("fs");
            const x = JSON.parse(fs.readFileSync("/tmp/pa-boards.json","utf8"));
            if (!["unauthorized","preview_auth_not_configured"].includes(x.error)) process.exit(1);
          '

          grep -F "CREATE_SANDBOX_PIN" functions/internal/pinterest-automation/api/pins.js
          grep -F "mode: 'sandbox'" functions/internal/pinterest-automation/health.js
          grep -F "Production-публикация заблокирована" public/internal/pinterest-automation/index.html

          echo "Pinterest Sandbox gateway PASS: server create path present, live=false, auth gate enforced"


      - name: Verify LayerPorter Home V3
        shell: bash
        run: |
          set -euo pipefail

          URL="https://layerporter.com/?verify=${{ github.sha }}"
          curl -fsS --max-time 20 -A "Mozilla/5.0" "$URL" -o /tmp/layerporter-home-v3.html
          grep -F '<title>LayerPorter — Chrome Extensions &amp; Browser Tools</title>' /tmp/layerporter-home-v3.html
          grep -F '<meta name="description" content="Download media with Chrome extensions and convert images, PDFs and design files with focused browser tools. No account, no unnecessary steps.">' /tmp/layerporter-home-v3.html
          test "$(grep -Fo 'Download media with Chrome extensions and convert images, PDFs and design files with focused browser tools. No account, no unnecessary steps.' /tmp/layerporter-home-v3.html | wc -l)" -eq 3
          grep -F '<h1>Save it.<br>Convert it.<br><span class="soft">Keep moving.</span></h1>' /tmp/layerporter-home-v3.html
          grep -F 'English <b>(EN)</b>' /tmp/layerporter-home-v3.html
          grep -F 'href="/home-v3.css"' /tmp/layerporter-home-v3.html
          grep -F 'src="/home-v3.js"' /tmp/layerporter-home-v3.html
          grep -F 'hreflang="en"' /tmp/layerporter-home-v3.html
          grep -F 'hreflang="x-default"' /tmp/layerporter-home-v3.html
          grep -F '/images/home/fashion-reference-960.webp' /tmp/layerporter-home-v3.html
          grep -F 'srcset="/images/home/fashion-reference-320.webp 320w' /tmp/layerporter-home-v3.html

          curl -fsSI --max-time 20 -A "Mozilla/5.0" "$URL" -o /tmp/layerporter-home-v3.headers
          grep -Fi 'content-security-policy:' /tmp/layerporter-home-v3.headers
          grep -Fi 'images.unsplash.com' /tmp/layerporter-home-v3.headers

          curl -fsS --max-time 20 -A "Mozilla/5.0" "https://layerporter.com/home-v3.css?verify=${{ github.sha }}" -o /tmp/home-v3.css
          curl -fsS --max-time 20 -A "Mozilla/5.0" "https://layerporter.com/home-v3.js?verify=${{ github.sha }}" -o /tmp/home-v3.js
          grep -F '.locale-current' /tmp/home-v3.css
          grep -F 'Download ${count} selected' /tmp/home-v3.js

          echo "LayerPorter Home V3 EN PASS"

          RU_URL="https://layerporter.com/ru/?verify=${{ github.sha }}"
          curl -fsS --max-time 20 -A "Mozilla/5.0" "$RU_URL" -o /tmp/layerporter-home-v3-ru.html
          grep -F '<html lang="ru">' /tmp/layerporter-home-v3-ru.html
          grep -F '<title>LayerPorter — расширения для браузера и онлайн-инструменты</title>' /tmp/layerporter-home-v3-ru.html
          grep -F '<meta name="description" content="Расширения для браузера LayerPorter: расширения для Chrome, расширения для Яндекс Браузера и онлайн-инструменты для скачивания медиа и конвертации файлов.">' /tmp/layerporter-home-v3-ru.html
          test "$(grep -Fo 'Расширения для браузера LayerPorter: расширения для Chrome, расширения для Яндекс Браузера и онлайн-инструменты для скачивания медиа и конвертации файлов.' /tmp/layerporter-home-v3-ru.html | wc -l)" -eq 3
          grep -F 'Расширения для Chrome и расширения для Яндекс Браузера помогают скачивать изображения и видео прямо со страниц, а онлайн-инструменты — менять форматы файлов без лишних сервисов и регистрации.' /tmp/layerporter-home-v3-ru.html
          grep -F '<link rel="canonical" href="https://layerporter.com/ru/"' /tmp/layerporter-home-v3-ru.html
          grep -F 'hreflang="en" href="https://layerporter.com/"' /tmp/layerporter-home-v3-ru.html
          grep -F 'hreflang="ru" href="https://layerporter.com/ru/"' /tmp/layerporter-home-v3-ru.html
          grep -F 'hreflang="x-default" href="https://layerporter.com/"' /tmp/layerporter-home-v3-ru.html
          grep -F 'Русский <b>(RU)</b>' /tmp/layerporter-home-v3-ru.html
          grep -F 'href="/ru/pinterest-downloader/"' /tmp/layerporter-home-v3-ru.html
          grep -F '/images/home/fashion-reference-960.webp' /tmp/layerporter-home-v3-ru.html
          grep -F 'alt="Референс уличного модного образа"' /tmp/layerporter-home-v3-ru.html
          grep -F '<h1>Сохраняйте.<br>Меняйте формат.<br><span class="soft">Работайте дальше.</span></h1>' /tmp/layerporter-home-v3-ru.html
          if grep -Fq 'images.unsplash.com' /tmp/layerporter-home-v3-ru.html; then
            echo "Home RU must not depend on Unsplash"
            exit 1
          fi

          curl -fsS --max-time 20 -A "Mozilla/5.0" "https://layerporter.com/sitemap.xml?verify=${{ github.sha }}" -o /tmp/layerporter-home-v3-sitemap.xml
          grep -F '<loc>https://layerporter.com/ru/</loc>' /tmp/layerporter-home-v3-sitemap.xml

          echo "LayerPorter Home V3 RU PASS"

          DE_URL="https://layerporter.com/de/?verify=${{ github.sha }}"
          curl -fsS --max-time 20 -A "Mozilla/5.0" "$DE_URL" -o /tmp/layerporter-home-v3-de.html
          grep -F '<html lang="de">' /tmp/layerporter-home-v3-de.html
          grep -F '<title>LayerPorter — Browser-Erweiterungen &amp; Online-Tools</title>' /tmp/layerporter-home-v3-de.html
          grep -F '<meta name="description" content="Browser-Erweiterungen und Chrome-Erweiterungen von LayerPorter sowie Online-Tools zum Speichern von Medien und Konvertieren von Bildern, PDFs und Dateien.">' /tmp/layerporter-home-v3-de.html
          test "$(grep -Fo 'Browser-Erweiterungen und Chrome-Erweiterungen von LayerPorter sowie Online-Tools zum Speichern von Medien und Konvertieren von Bildern, PDFs und Dateien.' /tmp/layerporter-home-v3-de.html | wc -l)" -eq 3
          grep -F 'LayerPorter bietet Browser-Erweiterungen, darunter Chrome-Erweiterungen, sowie Online-Tools zum Speichern von Medien und Konvertieren von Dateien.' /tmp/layerporter-home-v3-de.html
          grep -F '<link rel="canonical" href="https://layerporter.com/de/"' /tmp/layerporter-home-v3-de.html
          grep -F 'hreflang="en" href="https://layerporter.com/"' /tmp/layerporter-home-v3-de.html
          grep -F 'hreflang="ru" href="https://layerporter.com/ru/"' /tmp/layerporter-home-v3-de.html
          grep -F 'hreflang="de" href="https://layerporter.com/de/"' /tmp/layerporter-home-v3-de.html
          grep -F 'Deutsch <b>(DE)</b>' /tmp/layerporter-home-v3-de.html
          grep -F 'href="/de/pinterest-downloader/"' /tmp/layerporter-home-v3-de.html
          grep -F '<body class="home-de">' /tmp/layerporter-home-v3-de.html
          grep -F '<h1>Speichern.<br>Konvertieren.<br><span class="soft">Direkt weiter.</span></h1>' /tmp/layerporter-home-v3-de.html
          grep -F 'alt="Streetstyle-Mode als Referenz"' /tmp/layerporter-home-v3-de.html
          if grep -Fq 'alt="Pinterest visual reference"' /tmp/layerporter-home-v3-de.html; then
            echo "Home DE contains English image alt placeholder"
            exit 1
          fi
          grep -F '<loc>https://layerporter.com/de/</loc>' /tmp/layerporter-home-v3-sitemap.xml

          echo "LayerPorter Home V3 DE PASS"

          ES_URL="https://layerporter.com/es/?verify=${{ github.sha }}"
          curl -fsS --max-time 20 -A "Mozilla/5.0" "$ES_URL" -o /tmp/layerporter-home-v3-es.html
          grep -F '<html lang="es">' /tmp/layerporter-home-v3-es.html
          grep -F '<title>LayerPorter — Extensiones de navegador y herramientas online</title>' /tmp/layerporter-home-v3-es.html
          grep -F '<meta name="description" content="Extensiones de navegador y extensiones de Chrome de LayerPorter, además de herramientas online para guardar contenido y convertir imágenes, PDF y archivos.">' /tmp/layerporter-home-v3-es.html
          test "$(grep -Fo 'Extensiones de navegador y extensiones de Chrome de LayerPorter, además de herramientas online para guardar contenido y convertir imágenes, PDF y archivos.' /tmp/layerporter-home-v3-es.html | wc -l)" -eq 3
          grep -F 'LayerPorter reúne extensiones de navegador, incluidas extensiones de Chrome, y herramientas online para guardar imágenes y vídeos desde la web y convertir archivos al formato que necesitas.' /tmp/layerporter-home-v3-es.html
          grep -F '<link rel="canonical" href="https://layerporter.com/es/"' /tmp/layerporter-home-v3-es.html
          grep -F 'hreflang="en" href="https://layerporter.com/"' /tmp/layerporter-home-v3-es.html
          grep -F 'hreflang="ru" href="https://layerporter.com/ru/"' /tmp/layerporter-home-v3-es.html
          grep -F 'hreflang="de" href="https://layerporter.com/de/"' /tmp/layerporter-home-v3-es.html
          grep -F 'hreflang="es" href="https://layerporter.com/es/"' /tmp/layerporter-home-v3-es.html
          grep -F 'Español <b>(ES)</b>' /tmp/layerporter-home-v3-es.html
          grep -F 'href="/es/pinterest-downloader/"' /tmp/layerporter-home-v3-es.html
          grep -F '<body class="home-es">' /tmp/layerporter-home-v3-es.html
          grep -F '<h1>Guarda.<br>Convierte.<br><span class="soft">Sigue sin rodeos.</span></h1>' /tmp/layerporter-home-v3-es.html
          grep -F 'alt="Referencia de estilo urbano"' /tmp/layerporter-home-v3-es.html
          if grep -Fq 'alt="Pinterest visual reference"' /tmp/layerporter-home-v3-es.html; then
            echo "Home ES contains English image alt placeholder"
            exit 1
          fi
          grep -F '<loc>https://layerporter.com/es/</loc>' /tmp/layerporter-home-v3-sitemap.xml
          if grep -Fq '\n        <a href="/de/"' /tmp/layerporter-home-v3-es.html; then
            echo "Literal backslash-n found in locale menu"
            exit 1
          fi

          echo "LayerPorter Home V3 ES PASS"

          FR_URL="https://layerporter.com/fr/?verify=${{ github.sha }}"
          curl -fsS --max-time 20 -A "Mozilla/5.0" "$FR_URL" -o /tmp/layerporter-home-v3-fr.html
          grep -F '<html lang="fr">' /tmp/layerporter-home-v3-fr.html
          grep -F '<title>LayerPorter — Extensions de navigateur et outils en ligne</title>' /tmp/layerporter-home-v3-fr.html
          grep -F '<meta name="description" content="Extensions de navigateur et extensions Chrome LayerPorter, avec des outils en ligne pour enregistrer des médias et convertir des images, PDF et fichiers.">' /tmp/layerporter-home-v3-fr.html
          test "$(grep -Fo 'Extensions de navigateur et extensions Chrome LayerPorter, avec des outils en ligne pour enregistrer des médias et convertir des images, PDF et fichiers.' /tmp/layerporter-home-v3-fr.html | wc -l)" -eq 3
          grep -F 'LayerPorter réunit des extensions de navigateur, notamment des extensions Chrome, et des outils en ligne pour enregistrer images et vidéos depuis le web et convertir vos fichiers au bon format.' /tmp/layerporter-home-v3-fr.html
          grep -F '<link rel="canonical" href="https://layerporter.com/fr/"' /tmp/layerporter-home-v3-fr.html
          grep -F 'hreflang="fr" href="https://layerporter.com/fr/"' /tmp/layerporter-home-v3-fr.html
          grep -F 'Français <b>(FR)</b>' /tmp/layerporter-home-v3-fr.html
          grep -F 'href="/fr/pinterest-downloader/"' /tmp/layerporter-home-v3-fr.html
          grep -F '<body class="home-fr">' /tmp/layerporter-home-v3-fr.html
          grep -F '<h1>Enregistrez.<br>Convertissez.<br><span class="soft">Continuez sans détour.</span></h1>' /tmp/layerporter-home-v3-fr.html
          grep -F 'alt="Référence de style urbain"' /tmp/layerporter-home-v3-fr.html
          if grep -Fq 'alt="Pinterest visual reference"' /tmp/layerporter-home-v3-fr.html; then
            echo "Home FR contains English image alt placeholder"
            exit 1
          fi
