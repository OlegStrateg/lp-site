name: Deploy LayerPorter to Cloudflare Pages

on:
  workflow_dispatch:
  push:
    branches:
      - master

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Inspect Cloudflare Pages project
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npx wrangler@3.90.0 pages project list
          echo "=== PRODUCTION DEPLOYMENTS ==="
          npx wrangler@3.90.0 pages deployment list --project-name=layerporter --environment=production
          echo "=== PREVIEW DEPLOYMENTS ==="
          npx wrangler@3.90.0 pages deployment list --project-name=layerporter --environment=preview

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=layerporter --commit-hash=${{ github.sha }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify live Pinterest landing
        shell: bash
        run: |
          set -euo pipefail
          URL="https://layerporter.com/pinterest-downloader/"

          for i in {1..12}; do
            if curl -fsS --max-time 20 "$URL" -o /tmp/pinterest.html; then
              break
            fi
            if [ "$i" -eq 12 ]; then
              echo "Production page did not become available"
              exit 1
            fi
            sleep 5
          done

          grep -F "Download Pinterest videos" /tmp/pinterest.html
          grep -F "GIFs in one click." /tmp/pinterest.html
          grep -F "nmpahchhmcdejmfcmkphnbhckmlhhnon" /tmp/pinterest.html
          grep -F "utm_content=header" /tmp/pinterest.html
          grep -F "utm_content=hero" /tmp/pinterest.html
          grep -F "utm_content=final" /tmp/pinterest.html
          grep -F "utm_content=mobile_sticky" /tmp/pinterest.html
          grep -F "images.unsplash.com" /tmp/pinterest.html
          grep -F 'meta name="robots" content="noindex,follow"' /tmp/pinterest.html

          curl -fsS --max-time 20 "https://layerporter.com/pinterest-downloader/landing.css" -o /dev/null
          curl -fsS --max-time 20 "https://layerporter.com/pinterest-downloader/landing-motion.css" -o /dev/null
          curl -fsS --max-time 20 "https://layerporter.com/pinterest-downloader/landing.js" -o /dev/null

          curl -fsSI --max-time 20 "$URL" -o /tmp/pinterest.headers
          grep -i "content-security-policy:" /tmp/pinterest.headers | grep -F "https://images.unsplash.com"
