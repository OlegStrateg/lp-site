name: Deploy LayerPorter to Cloudflare Pages

on:
  workflow_dispatch:
  push:
    branches:
      - master

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Inspect Cloudflare Pages project
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npx wrangler@3.90.0 pages project list
          echo "=== PRODUCTION DEPLOYMENTS ==="
          npx wrangler@3.90.0 pages deployment list --project-name=layerporter --environment=production
          echo "=== PREVIEW DEPLOYMENTS ==="
          npx wrangler@3.90.0 pages deployment list --project-name=layerporter --environment=preview

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=layerporter --branch=main --commit-hash=${{ github.sha }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify all 52 Pinterest landings
        shell: bash
        run: |
          set -euo pipefail

          BASE="https://layerporter.com"
          EN_URL="$BASE/pinterest-downloader/?verify=${{ github.sha }}"

          # Wait until the just-deployed revision reaches production.
          for i in {1..24}; do
            if curl -fsS --max-time 20 -A "Mozilla/5.0" "$EN_URL" -o /tmp/pinterest-en.html \
              && grep -Fq 'name="lp-locale" content="en"' /tmp/pinterest-en.html \
              && grep -Fq 'id="privacyConsent"' /tmp/pinterest-en.html \
              && grep -Fq 'lp_pd_attr' /tmp/pinterest-en.html; then
              echo "Current Pinterest attribution build is live"
              break
            fi
            if [ "$i" -eq 24 ]; then
              echo "Current locale build did not propagate"
              exit 1
            fi
            sleep 5
          done

          # Base visual/motion assets and Store attribution.
          grep -F "nmpahchhmcdejmfcmkphnbhckmlhhnon" /tmp/pinterest-en.html
          grep -F "utm_content=header" /tmp/pinterest-en.html
          grep -F "utm_content=hero" /tmp/pinterest-en.html
          grep -F "utm_content=final" /tmp/pinterest-en.html
          grep -F "utm_content=mobile_sticky" /tmp/pinterest-en.html
          grep -F "images.unsplash.com" /tmp/pinterest-en.html

          : > /tmp/pinterest.styles.css
          grep -oE 'href="[^"]+\.css"' /tmp/pinterest-en.html | sed 's/^href="//;s/"$//' | sort -u | while read -r href; do
            if [[ "$href" == http* ]]; then
              css_url="$href"
            else
              css_url="$BASE$href"
            fi
            curl -fsS --max-time 20 -A "Mozilla/5.0" "$css_url" >> /tmp/pinterest.styles.css
          done
          grep -F "@keyframes ctaSweep" /tmp/pinterest.styles.css

          # Static manifest created by the same build must contain 52 locales.
          node - <<'NODE'
          const fs = require('fs');
          const rows = JSON.parse(fs.readFileSync('dist/pinterest-locales.json', 'utf8'));
          if (rows.length !== 52) throw new Error('Expected 52 locales, got ' + rows.length);
          const hold = rows.filter(x => x.hold).map(x => x.code);
          const expectedHold = ['am','fil','ml','sl','sw','ta','te'];
          if (JSON.stringify(hold) !== JSON.stringify(expectedHold)) {
            throw new Error('Unexpected HOLD set: ' + JSON.stringify(hold));
          }
          console.log('Build manifest: 52/52; research HOLD but indexed:', hold.join(', '));
          NODE

          # Every locale must be live, self-attributed and indexable.
          ok=0
          while IFS=$'\t' read -r code route status; do
            if [ "$code" = "en" ]; then
              path="/pinterest-downloader/"
            else
              path="/$route/pinterest-downloader/"
            fi
            url="$BASE$path?verify=${{ github.sha }}"
            tmp="/tmp/pinterest-$code.html"

            passed=0
            for attempt in {1..6}; do
              if curl -fsS --max-time 20 -A "Mozilla/5.0" "$url" -o "$tmp" \
                && grep -Fq "name=\"lp-locale\" content=\"$code\"" "$tmp" \
                && grep -Fq "utm_term=$code" "$tmp"; then
                passed=1
                break
              fi
              sleep 3
            done

            if [ "$passed" -ne 1 ]; then
              echo "FAILED locale: $code -> $path"
              exit 1
            fi

            grep -Fq 'meta name="robots" content="index,follow"' "$tmp"
            grep -Fq 'hreflang="x-default"' "$tmp"
            grep -Fq "nmpahchhmcdejmfcmkphnbhckmlhhnon" "$tmp"
            ok=$((ok+1))
            echo "OK $code $status $path"
          done < dist/pinterest-locales.tsv

          if [ "$ok" -ne 52 ]; then
            echo "Expected 52 live locales, got $ok"
            exit 1
          fi

          # Scoped CSP must work on EN and representative localized paths.
          for path in "/pinterest-downloader/" "/es/pinterest-downloader/" "/ar/pinterest-downloader/" "/zh-cn/pinterest-downloader/"; do
            curl -fsSI --max-time 20 -A "Mozilla/5.0" "$BASE$path" -o /tmp/pinterest.headers
            grep -i "content-security-policy:" /tmp/pinterest.headers | grep -F "https://images.unsplash.com"
            grep -i "content-security-policy:" /tmp/pinterest.headers | grep -F "script-src 'self' 'unsafe-inline'"
          done

          curl -fsS --max-time 20 -A "Mozilla/5.0" "$BASE/sitemap.xml?verify=${{ github.sha }}" -o /tmp/sitemap.xml
          node - <<'NODE'
          const fs = require('fs');
          const xml = fs.readFileSync('/tmp/sitemap.xml','utf8');
          const rows = JSON.parse(fs.readFileSync('dist/pinterest-locales.json','utf8'));
          for (const row of rows) {
            if (!xml.includes('<loc>' + row.url + '</loc>')) {
              throw new Error('Missing sitemap URL: ' + row.url);
            }
          }
          console.log('Sitemap PASS: 52/52 locale URLs');
          NODE

          echo "=== VERIFY ATTRIBUTION + PRIVACY ==="
          grep -F 'id="privacyConsent"' /tmp/pinterest-en.html
          grep -F "lp_pd_attr" /tmp/pinterest-en.html
          grep -F "lp_privacy" /tmp/pinterest-en.html
          grep -F "globalPrivacyControl" /tmp/pinterest-en.html
          grep -F 'href="/privacy/#cookies"' /tmp/pinterest-en.html

          curl -fsS --max-time 20 -A "Mozilla/5.0" "$BASE/pinterest-downloader/welcome/?verify=${{ github.sha }}" -o /tmp/pinterest-welcome.html
          grep -F "const ATTR_COOKIE = 'lp_pd_attr'" /tmp/pinterest-welcome.html
          grep -F "body.attribution = landingAttribution" /tmp/pinterest-welcome.html
          grep -F "readCookie('lp_privacy') !== 'analytics:1'" /tmp/pinterest-welcome.html
          grep -F "webvisor:false" /tmp/pinterest-welcome.html
          grep -F "clickmap:false" /tmp/pinterest-welcome.html

          curl -fsS --max-time 20 -A "Mozilla/5.0" "$BASE/privacy/?verify=${{ github.sha }}" -o /tmp/privacy.html
          grep -F "lp_pd_attr" /tmp/privacy.html
          grep -F "Chrome Web Store Limited Use" /tmp/privacy.html
          grep -F "Reset privacy choices" /tmp/privacy.html

          echo "LIVE VERIFY PASS: 52/52 Pinterest landing URLs"

      - name: Verify Pinterest Automation preview noindex
        shell: bash
        run: |
          set -euo pipefail

          BASE="https://layerporter.com"
          URL="$BASE/internal/pinterest-automation/?verify=${{ github.sha }}"

          curl -fsS --max-time 20 -A "Mozilla/5.0" -D /tmp/pa.headers "$URL" -o /tmp/pa.html
          grep -F 'meta name="robots" content="noindex,nofollow,noarchive,nosnippet,noimageindex"' /tmp/pa.html
          grep -i '^x-robots-tag:' /tmp/pa.headers | grep -Ei 'noindex'
          grep -i '^cache-control:' /tmp/pa.headers | grep -Ei 'no-store'

          curl -fsS --max-time 20 -A "Mozilla/5.0" "$BASE/internal/pinterest-automation/styles.css?verify=${{ github.sha }}" -o /tmp/pa.css
          curl -fsS --max-time 20 -A "Mozilla/5.0" "$BASE/internal/pinterest-automation/app.js?verify=${{ github.sha }}" -o /tmp/pa.js
          curl -fsS --max-time 20 -A "Mozilla/5.0" "$BASE/internal/pinterest-automation/health?verify=${{ github.sha }}" -o /tmp/pa-health.json
          grep -F 'Pinterest Automation' /tmp/pa.html
          grep -F 'newDraftBtn' /tmp/pa.js
          grep -F '"ok":true' /tmp/pa-health.json
          grep -F '"livePublishing":false' /tmp/pa-health.json

          curl -fsS --max-time 20 -A "Mozilla/5.0" "$BASE/sitemap.xml?verify=${{ github.sha }}" -o /tmp/pa-sitemap.xml
          if grep -Fq '/internal/pinterest-automation/' /tmp/pa-sitemap.xml; then
            echo "Internal Pinterest Automation route must not be in sitemap"
            exit 1
          fi

          echo "Pinterest Automation preview PASS: live, assets OK, noindex, absent from sitemap"

      - name: Verify Pinterest Sandbox gateway locked
        shell: bash
        run: |
          set -euo pipefail

          BASE="https://layerporter.com/internal/pinterest-automation"

          curl -fsS --max-time 20 -A "Mozilla/5.0" "$BASE/health?verify=${{ github.sha }}" -o /tmp/pa-sandbox-health.json
          node -e '
            const fs = require("fs");
            const x = JSON.parse(fs.readFileSync("/tmp/pa-sandbox-health.json","utf8"));
            if (x.ok !== true) process.exit(1);
            if (x.mode !== "sandbox") process.exit(1);
            if (x.livePublishing !== false) process.exit(1);
            for (const k of ["sandboxConfigured","previewAuthConfigured","previewAuthenticated"]) {
              if (typeof x[k] !== "boolean") process.exit(1);
            }
          '

          curl -fsS --max-time 20 -A "Mozilla/5.0" "$BASE/auth/status?verify=${{ github.sha }}" -o /tmp/pa-auth.json
          node -e '
            const fs = require("fs");
            const x = JSON.parse(fs.readFileSync("/tmp/pa-auth.json","utf8"));
            if (x.ok !== true) process.exit(1);
            if (typeof x.configured !== "boolean" || typeof x.authenticated !== "boolean") process.exit(1);
          '

          STATUS="$(curl -sS -o /tmp/pa-boards.json -w "%{http_code}" --max-time 20 -A "Mozilla/5.0" "$BASE/api/boards?verify=${{ github.sha }}")"
          if [ "$STATUS" != "401" ] && [ "$STATUS" != "503" ]; then
            echo "Boards endpoint must stay locked without internal auth, got HTTP $STATUS"
            cat /tmp/pa-boards.json
            exit 1
          fi

          node -e '
            const fs = require("fs");
            const x = JSON.parse(fs.readFileSync("/tmp/pa-boards.json","utf8"));
            if (!["unauthorized","preview_auth_not_configured"].includes(x.error)) process.exit(1);
          '

          grep -F "CREATE_SANDBOX_PIN" public/internal/pinterest-automation/app.js
          grep -F "Pinterest Sandbox" public/internal/pinterest-automation/index.html

          echo "Pinterest Sandbox gateway PASS: deployed, live=false, auth gate enforced"

