name: Extract Audio Production Final Verification

on:
  pull_request:
    branches: [test/LP-078-prod-base]
    paths:
      - 'scripts/prod-verify-extract-audio-final.mjs'
      - '.github/workflows/extract-audio-production-final-verification.yml'

permissions:
  contents: read

jobs:
  production-final:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Setup Chrome
        id: setup-chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: stable
          install-dependencies: true

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Ensure ffmpeg and ffprobe
        run: |
          set -euxo pipefail
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --no-install-recommends -y ffmpeg
          fi
          command -v ffmpeg
          command -v ffprobe
          test -x "$CHROME_PATH"
          "$CHROME_PATH" --version
        env:
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}

      - name: Verify deployed production Extract Audio
        run: node scripts/prod-verify-extract-audio-final.mjs
        env:
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: extract-audio-production-final
          path: artifacts/extract-audio-production-final/
          if-no-files-found: warn
          retention-days: 30
