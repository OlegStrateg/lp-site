name: LP-096 MCP Release Review

on:
  push:
    branches:
      - fix/LP-096-mcp-release-review-m1-m3

jobs:
  distribution-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22.16.0'
          cache: 'npm'
      - name: Verify seven-tool distribution contract
        run: node packages/image-optimizer-mcp/scripts/verify-distribution-contract.mjs

  source-setup:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22.16.0'
          cache: 'npm'
      - name: Verify clean source setup from README sequence
        run: node packages/image-optimizer-mcp/scripts/verify-source-setup.mjs

  mcp-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22.16.0'
          cache: 'npm'
      - name: Install MCP dependencies
        working-directory: packages/image-optimizer-mcp
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Sync shared image-core
        working-directory: packages/image-optimizer-mcp
        run: npm run sync:core
      - name: Run MCP tests including parallel byte-budget regression
        working-directory: packages/image-optimizer-mcp
        run: npm test

  tarball-client-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22.16.0'
          cache: 'npm'
      - name: Pack, clean-install and verify real stdio MCP client flow
        env:
          LP096_PROOF_DIR: /tmp/lp096-release-proof
        run: node packages/image-optimizer-mcp/scripts/release-tarball-client-smoke.mjs
      - name: Upload decoded image and release-smoke evidence
        uses: actions/upload-artifact@v4
        with:
          name: lp096-release-smoke-evidence
          path: /tmp/lp096-release-proof
          if-no-files-found: error

  public-pages-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22.16.0'
          cache: 'npm'
      - name: Build Astro public MCP pages
        run: |
          npm ci --no-audit --no-fund
          npx astro build
          test -f dist/mcp/website-image-optimizer/index.html
          test -f dist/docs/mcp/website-image-optimizer/index.html
