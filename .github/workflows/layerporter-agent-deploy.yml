name: LayerPorter Agent — Retired GitHub Deploy

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired-control-plane:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Control-plane notice
        shell: bash
        run: |
          set -euo pipefail
          echo 'GitHub Actions deployment for LayerPorter Agent is retired.'
          echo 'Canonical production deployment is Cloudflare Workers Builds connected to master.'
          echo 'This workflow intentionally performs no Worker deploy, secret mutation, KV mutation, or schedule mutation.'
          echo 'For runtime verification use the read-only Verify LayerPorter Agent Runtime workflow.'
