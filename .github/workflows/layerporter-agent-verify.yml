name: LayerPorter Agent Verify

on:
  pull_request:
    paths:
      - 'packages/layerporter-agent/**'
      - 'wrangler-layerporter-agent.toml.example'
      - '.github/workflows/layerporter-agent-verify.yml'
      - '.github/workflows/layerporter-agent-deploy.yml'
      - '.github/workflows/layerporter-agent-cron-verify.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        working-directory: packages/layerporter-agent
        run: npm run check
      - name: Unit and contract tests
        working-directory: packages/layerporter-agent
        run: npm test
      - name: Guard against committed secrets
        run: |
          set -euo pipefail
          if grep -RInE 'sk-[A-Za-z0-9_-]{20,}|gh[pousr]_[A-Za-z0-9]{20,}' packages/layerporter-agent/src; then
            echo 'Credential-like value detected in runtime source'
            exit 1
          fi
          if grep -nE '^(POSTINGBOARD_API_KEY|OPENAI_API_KEY)[[:space:]]*=' wrangler-layerporter-agent.toml.example; then
            echo 'Secret must not be assigned in Wrangler config'
            exit 1
          fi
      - name: Control-plane safety guard
        run: |
          set -euo pipefail
          DEPLOY='.github/workflows/layerporter-agent-deploy.yml'
          RUNTIME='.github/workflows/layerporter-agent-cron-verify.yml'

          if grep -nE '^[[:space:]]+push:' "$DEPLOY"; then
            echo 'Retired GitHub deploy workflow must never auto-run on push'
            exit 1
          fi

          if grep -nE -- '-X[[:space:]]+(PUT|POST|DELETE)|wrangler(@[^[:space:]]+)?[[:space:]]+deploy|secret[[:space:]]+put' "$RUNTIME"; then
            echo 'Runtime verifier must remain read-only'
            exit 1
          fi

          echo 'Control-plane guard PASS: Cloudflare native deploy is canonical; GitHub runtime verifier is read-only'
