name: LP-046 Validate Extensions Locale Switcher

on:
  push:
    branches:
      - fix/LP-046-extensions-locale-switcher

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Validate locale switcher
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          pages={
            "en":("dist/extensions/index.html", 'href="/extensions/" lang="en" hreflang="en" aria-current="page"'),
            "ru":("dist/ru/extensions/index.html", 'href="/ru/extensions/" lang="ru" hreflang="ru" aria-current="page"'),
            "de":("dist/de/extensions/index.html", 'href="/de/extensions/" lang="de" hreflang="de" aria-current="page"'),
            "es":("dist/es/extensions/index.html", 'href="/es/extensions/" lang="es" hreflang="es" aria-current="page"'),
            "fr":("dist/fr/extensions/index.html", 'href="/fr/extensions/" lang="fr" hreflang="fr" aria-current="page"'),
            "pt":("dist/pt-br/extensions/index.html", 'href="/pt-br/extensions/" lang="pt-BR" hreflang="pt-BR" aria-current="page"'),
            "ja":("dist/ja/extensions/index.html", 'href="/ja/extensions/" lang="ja" hreflang="ja" aria-current="page"'),
            "zh":("dist/zh-cn/extensions/index.html", 'href="/zh-cn/extensions/" lang="zh-CN" hreflang="zh-CN" aria-current="page"'),
          }
          required=[
            '/extensions/','/ru/extensions/','/de/extensions/','/es/extensions/',
            '/fr/extensions/','/pt-br/extensions/','/ja/extensions/','/zh-cn/extensions/'
          ]
          for slug,(file,current) in pages.items():
            s=Path(file).read_text("utf-8")
            assert 'extensions-locale-menu' in s, slug
            assert 'extensions-locale-options' in s, slug
            assert current in s, (slug,current)
            for href in required:
              assert f'href="{href}"' in s, (slug,href)
          css=Path("dist/extensions-hub.css").read_text("utf-8")
          assert ".extensions-locale-menu" in css
          assert ".extensions-locale-options" in css
          print("LP-046 LOCALE SWITCHER PASS")
          PY
