name: LP-043 Validate Home WebP

on:
  push:
    branches:
      - perf/LP-043-home-webp-images

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Validate WebP assets
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pillow
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          root=Path("public/images/home")
          files=sorted(root.glob("*.webp"))
          assert len(files)==20, f"Expected 20 WebP assets, got {len(files)}"

          expected_widths={320,640,960,1440}
          groups={}
          total=0
          for p in files:
              with Image.open(p) as im:
                  assert im.format=="WEBP", (p, im.format)
                  w,h=im.size
                  assert w in expected_widths, (p,w,h)
                  assert h>0
              size=p.stat().st_size
              assert size < 200_000, f"{p} too large: {size}"
              total += size
              stem=p.stem.rsplit("-",1)[0]
              groups.setdefault(stem,set()).add(w)
              print(f"{p}: {w}x{h}, {size} bytes")

          assert len(groups)==5, groups.keys()
          for stem,widths in groups.items():
              assert widths==expected_widths, (stem,widths)

          print("TOTAL_WEBP_BYTES", total)
          assert total < 1_200_000, total
          PY

      - name: Validate built Home HTML
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          pages={
            "EN":Path("dist/index.html"),
            "RU":Path("dist/ru/index.html"),
            "DE":Path("dist/de/index.html"),
            "ES":Path("dist/es/index.html"),
            "FR":Path("dist/fr/index.html"),
            "PT":Path("dist/pt-br/index.html"),
            "JA":Path("dist/ja/index.html"),
            "ZH":Path("dist/zh-cn/index.html"),
          }

          for lang,p in pages.items():
              s=p.read_text("utf-8")
              imgs=re.findall(r"<img\b[^>]*>",s)
              local=[x for x in imgs if "/images/home/" in x]
              assert len(local)==11, (lang,len(local))
              assert all("srcset=" in x for x in local), lang
              assert all("sizes=" in x for x in local), lang
              assert all(re.search(r'width="\d+"',x) for x in local), lang
              assert all(re.search(r'height="\d+"',x) for x in local), lang
              assert "images.unsplash.com" not in "\n".join(imgs), lang
              assert not any(re.search(r'src="/(?:og|art)/',x) for x in imgs), lang
              assert sum('fetchpriority="high"' in x for x in local)==1, lang
              assert sum('loading="lazy"' in x for x in local)==4, lang
              print(lang,"PASS",len(local))
          PY
