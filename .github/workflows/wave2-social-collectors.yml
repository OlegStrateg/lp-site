name: Wave2 social collectors lab

on:
  push:
    branches:
      - lab/vendor-trend-tools-smoke
    paths:
      - '.github/workflows/wave2-social-collectors.yml'
  workflow_dispatch:

jobs:
  instagram_0xping:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - run: |
          git clone https://github.com/0xping/instagram-scraper.git tool
          git -C tool checkout 6915cf126f6e81958d718dfd44efd835368cbb48
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.1'
          cache: 'npm'
          cache-dependency-path: tool/package-lock.json
      - name: Install exact original dependencies
        run: cd tool && npm ci
      - name: Original typecheck, lint, tests, E2E
        run: |
          cd tool
          npm run typecheck
          npm run lint
          npm test
          npm run validate:e2e
      - name: Verify no upstream edits
        run: git -C tool diff --exit-code

  chocodata_full_free:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - run: |
          git clone https://github.com/ChocoData-com/tiktok-scraper.git tool
          git -C tool checkout 54fb4ddc6f0fa6b5a522ecb319e2f800dce59169
      - uses: actions/setup-python@v6
        with: { python-version: '3.12' }
      - run: python -m pip install -r tool/requirements.txt >/dev/null
      - name: Live free video parse without key or login
        shell: bash
        run: |
          set -euo pipefail
          cd tool
          set +e
          timeout 60s python free_scraper/tiktok_free_scraper.py \
            "https://www.tiktok.com/@duolingo/video/7459895174467177774" \
            > /tmp/out.txt 2>&1
          RC=$?
          set -e
          cat /tmp/out.txt
          echo "exit=$RC"
          test "$RC" -eq 0 -o "$RC" -eq 124

  chocodata_post_free:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - run: |
          git clone https://github.com/ChocoData-com/tiktok-post-scraper.git tool
          git -C tool checkout c9014ff2cd8a8e9e76f1274b279541afe1e3a496
      - uses: actions/setup-python@v6
        with: { python-version: '3.12' }
      - run: python -m pip install -r tool/requirements.txt >/dev/null
      - name: Live free post parse without key or login
        shell: bash
        run: |
          set -euo pipefail
          cd tool
          set +e
          timeout 60s python free_scraper/tiktok_post_free_scraper.py \
            "https://www.tiktok.com/@duolingo/video/7459895174467177774" \
            > /tmp/out.txt 2>&1
          RC=$?
          set -e
          cat /tmp/out.txt
          echo "exit=$RC"
          test "$RC" -eq 0 -o "$RC" -eq 124

  chocodata_video_free:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - run: |
          git clone https://github.com/ChocoData-com/tiktok-video-scraper.git tool
          git -C tool checkout 5752a8217211706d21a289e87d8711d0907acdee
      - uses: actions/setup-python@v6
        with: { python-version: '3.12' }
      - run: python -m pip install -r tool/requirements.txt >/dev/null
      - name: Live free video parse without key or login
        shell: bash
        run: |
          set -euo pipefail
          cd tool
          set +e
          timeout 60s python free_scraper/tiktok_video_free_scraper.py \
            "https://www.tiktok.com/@duolingo/video/7459895174467177774" \
            > /tmp/out.txt 2>&1
          RC=$?
          set -e
          cat /tmp/out.txt
          echo "exit=$RC"
          test "$RC" -eq 0 -o "$RC" -eq 124
