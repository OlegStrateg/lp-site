name: LP-043 Generate Home WebP Assets

on:
  push:
    branches:
      - perf/LP-043-home-webp-images

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: perf/LP-043-home-webp-images
          fetch-depth: 0

      - name: Generate optimized WebP assets
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pillow
          python - <<'PY'
          from pathlib import Path
          from urllib.request import Request, urlopen
          from io import BytesIO
          from PIL import Image

          out = Path("public/images/home")
          out.mkdir(parents=True, exist_ok=True)

          sources = {
              "fashion-reference": "https://images.unsplash.com/photo-1515886657613-9f3515b0c78f?auto=format&fit=crop&q=92&w=2000",
              "travel-reference": "https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&q=92&w=2000",
              "workspace-reference": "https://images.unsplash.com/photo-1494438639946-1ebd1d20bf85?auto=format&fit=crop&q=92&w=2000",
              "fashion-board-reference": "https://images.unsplash.com/photo-1483985988355-763728e1935b?auto=format&fit=crop&q=92&w=2000",
              "creative-workflow-reference": "https://images.unsplash.com/photo-1529139574466-a303027c1d8b?auto=format&fit=crop&q=92&w=2200",
          }
          widths = [320, 640, 960, 1440]
          headers = {"User-Agent": "Mozilla/5.0 LayerPorter image optimizer"}

          for stem, url in sources.items():
              req = Request(url, headers=headers)
              data = urlopen(req, timeout=30).read()
              im = Image.open(BytesIO(data)).convert("RGB")
              sw, sh = im.size
              print(stem, "source", sw, sh, len(data))
              for w in widths:
                  if w > sw:
                      continue
                  h = round(sh * w / sw)
                  resized = im.resize((w, h), Image.Resampling.LANCZOS)
                  p = out / f"{stem}-{w}.webp"
                  resized.save(p, "WEBP", quality=82, method=6)
                  with Image.open(p) as chk:
                      assert chk.format == "WEBP"
                      assert chk.size == (w, h)
                  print("  ", p, p.stat().st_size, (w, h))
          PY

      - name: Commit generated assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/images/home/*.webp
          if git diff --cached --quiet; then
            echo "No asset changes"
            exit 0
          fi
          git commit -m "LP-043: generate optimized Home WebP assets"
          git push origin HEAD:perf/LP-043-home-webp-images
