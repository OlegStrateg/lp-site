name: Verify LayerPorter Agent Runtime

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: layerporter-agent-read-only-runtime-check
  cancel-in-progress: false

jobs:
  verify-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_API: https://api.cloudflare.com/client/v4
      KV_TITLE: layerporter-agent-state
      SCRIPT_NAME: layerporter-agent

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Resolve Cloudflare account and dedicated KV
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo 'Missing CLOUDFLARE_API_TOKEN'; exit 1; }
          npx wrangler@4.131.1 whoami --json > /tmp/lp-agent-whoami.json
          node - <<'NODE'
          const fs = require('fs');
          const x = JSON.parse(fs.readFileSync('/tmp/lp-agent-whoami.json', 'utf8'));
          if (x.loggedIn !== true || !Array.isArray(x.accounts) || x.accounts.length !== 1 || !x.accounts[0]?.id) process.exit(1);
          fs.writeFileSync('/tmp/lp-agent-account-id', String(x.accounts[0].id), { mode: 0o600 });
          NODE
          CLOUDFLARE_ACCOUNT_ID="$(cat /tmp/lp-agent-account-id)"
          echo "CLOUDFLARE_ACCOUNT_ID=$CLOUDFLARE_ACCOUNT_ID" >> "$GITHUB_ENV"

          AUTH="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
          KV_BASE="${CF_API}/accounts/${CLOUDFLARE_ACCOUNT_ID}/storage/kv/namespaces"
          curl -fsS "$KV_BASE?per_page=100&direction=asc&order=title" -H "$AUTH" -H 'Accept: application/json' -o /tmp/lp-agent-kv-list.json
          jq -e '.success == true and (.result | type == "array")' /tmp/lp-agent-kv-list.json >/dev/null
          KV_ID="$(jq -r --arg title "$KV_TITLE" '.result[] | select(.title == $title) | .id' /tmp/lp-agent-kv-list.json | head -n1)"
          test -n "$KV_ID" || { echo 'Dedicated LayerPorter Agent KV was not found'; exit 1; }
          echo "KV_ID=$KV_ID" >> "$GITHUB_ENV"
          rm -f /tmp/lp-agent-whoami.json /tmp/lp-agent-account-id /tmp/lp-agent-kv-list.json
          echo 'Cloudflare account and dedicated agent KV resolved'

      - name: Read-only schedule check
        shell: bash
        run: |
          set -euo pipefail
          AUTH="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
          SCHEDULE_URL="${CF_API}/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${SCRIPT_NAME}/schedules"
          curl -fsS "$SCHEDULE_URL" -H "$AUTH" -H 'Accept: application/json' -o /tmp/lp-agent-schedules.json
          jq -e '.success == true and (.result.schedules | length == 1) and .result.schedules[0].cron == "0 * * * *"' /tmp/lp-agent-schedules.json >/dev/null
          echo 'Schedule PASS: exactly one hourly cron is configured'

      - name: Read heartbeat and memory without mutations
        shell: bash
        run: |
          set -euo pipefail
          AUTH="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
          VALUE_BASE="${CF_API}/accounts/${CLOUDFLARE_ACCOUNT_ID}/storage/kv/namespaces/${KV_ID}/values"
          curl -fsS "$VALUE_BASE/layerporter-agent%3Aheartbeat%3Av1" -H "$AUTH" -H 'Accept: application/json' -o /tmp/lp-agent-heartbeat.json
          curl -fsS "$VALUE_BASE/layerporter-agent%3Amemory%3Av1" -H "$AUTH" -H 'Accept: application/json' -o /tmp/lp-agent-memory.json
          chmod 600 /tmp/lp-agent-heartbeat.json /tmp/lp-agent-memory.json
          echo 'Heartbeat and memory snapshots loaded read-only'

      - name: Verify fresh bounded live runtime and circuit breaker
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { evaluateHeartbeat } from './packages/layerporter-agent/src/heartbeat-gate.js';
          import { evaluateLiveSafety } from './packages/layerporter-agent/src/live-safety-gate.js';
          import { createAgentConfig } from './packages/layerporter-agent/src/config.js';

          const control = JSON.parse(fs.readFileSync('packages/layerporter-agent/pilot-control.json', 'utf8'));
          const heartbeat = JSON.parse(fs.readFileSync('/tmp/lp-agent-heartbeat.json', 'utf8'));
          const memory = JSON.parse(fs.readFileSync('/tmp/lp-agent-memory.json', 'utf8'));
          const activatedMs = Date.parse(control.activatedAt || '');
          const startedMs = Date.parse(heartbeat.startedAt || '');
          const now = new Date();
          const maxAgeMs = 90 * 60 * 1000;

          if (!Number.isFinite(activatedMs) || !Number.isFinite(startedMs)) {
            throw new Error('Activation or heartbeat timestamp is invalid');
          }
          if (startedMs < activatedMs) throw new Error('Heartbeat predates current live activation');
          if (now.getTime() - startedMs > maxAgeMs) throw new Error('Heartbeat is stale (>90 minutes)');

          const hb = evaluateHeartbeat(heartbeat, activatedMs, {
            expectedWriteMode: 'live',
            maxWrites: Number(control.maxWritesPerRun),
          });
          if (hb.code !== 0) throw new Error(`Heartbeat gate failed: ${hb.status}`);

          const config = createAgentConfig({
            LAYERPORTER_AGENT_WRITE_MODE: 'live',
            LAYERPORTER_AGENT_LIVE_ACTIVATED_AT: control.activatedAt,
            LAYERPORTER_AGENT_LIVE_HARD_STOP_AT: control.hardStopAt,
            LAYERPORTER_AGENT_MAX_RESEARCH_PER_RUN: String(control.maxResearchPerRun),
            LAYERPORTER_AGENT_MAX_WRITES_PER_RUN: String(control.maxWritesPerRun),
            LAYERPORTER_AGENT_MAX_DAILY_WRITES: String(control.maxDailyWrites),
            LAYERPORTER_AGENT_MIN_LIVE_OPPORTUNITY_SCORE: String(control.minimumOpportunityScore),
            LAYERPORTER_AGENT_MIN_LIVE_EVIDENCE_SCORE: String(control.minimumEvidenceScore),
            LAYERPORTER_AGENT_ENABLE_THREAD_CREATION: String(control.enableThreadCreation),
          }, now);

          const safety = evaluateLiveSafety(memory, config, now);
          if (!safety.allowed) throw new Error(`Live circuit breaker is closed: ${safety.reason}`);

          console.log(JSON.stringify({
            status: 'PASS',
            startedAt: heartbeat.startedAt,
            finishedAt: heartbeat.finishedAt,
            writeMode: heartbeat.writeMode,
            writesThisRun: heartbeat.result?.writesThisRun ?? null,
            candidates: heartbeat.result?.candidates ?? null,
            researched: heartbeat.result?.researched ?? null,
            strategyRecommendation: heartbeat.result?.pilot?.strategyRecommendation ?? null,
          }));
          NODE
          rm -f /tmp/lp-agent-heartbeat.json /tmp/lp-agent-memory.json /tmp/lp-agent-schedules.json
          echo 'READ-ONLY LIVE RUNTIME VERIFIED'

      - name: Mutation guard
        shell: bash
        run: |
          set -euo pipefail
          echo 'This workflow contains no Cloudflare POST/PUT/DELETE calls and performs no deploy or secret mutation.'
