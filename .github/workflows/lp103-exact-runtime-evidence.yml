name: LP-103 Exact Runtime Evidence

on:
  push:
    branches:
      - verify/LP-103-exact-runtime-evidence-2026-09-25

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout exact LP-103 candidate
        uses: actions/checkout@v4
        with:
          ref: bf509e8b3a1335f6a8ab056efb1381ec6de2e034

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.16.0

      - name: Capture environment
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/lp103-evidence"
          {
            echo "HEAD=$(git rev-parse HEAD)"
            echo "OS:"
            cat /etc/os-release
            echo "UNAME:"
            uname -a
            echo "NODE=$(node -v)"
            echo "NPM=$(npm -v)"
            echo "ARCH=$(node -p 'process.arch')"
            echo "PLATFORM=$(node -p 'process.platform')"
            echo "REGISTRY=$(npm config get registry)"
          } | tee "$RUNNER_TEMP/lp103-evidence/environment.txt"
          test "$(git rev-parse HEAD)" = "bf509e8b3a1335f6a8ab056efb1381ec6de2e034"

      - name: Install image-core exact dependencies
        working-directory: packages/image-core
        shell: bash
        run: |
          set -euo pipefail
          npm install --package-lock=false --no-audit --no-fund 2>&1 | tee "$RUNNER_TEMP/lp103-evidence/image-core-install.log"

      - name: Capture Sharp and native dependency evidence
        working-directory: packages/image-core
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE' | tee "$RUNNER_TEMP/lp103-evidence/sharp-versions.json"
          import fs from 'node:fs';
          import sharp from 'sharp';
          const pkg = JSON.parse(fs.readFileSync('./node_modules/sharp/package.json', 'utf8'));
          const report = {
            sharpPackageVersion: pkg.version,
            process: { node: process.version, platform: process.platform, arch: process.arch },
            sharpVersions: sharp.versions
          };
          console.log(JSON.stringify(report, null, 2));
          if (pkg.version !== '0.35.4') process.exit(23);
          NODE

          npm ls sharp @img/sharp-linux-x64 @img/sharp-libvips-linux-x64 --all --json             | tee "$RUNNER_TEMP/lp103-evidence/npm-ls-native.json"

          node --input-type=module <<'NODE' | tee "$RUNNER_TEMP/lp103-evidence/native-packages.json"
          import fs from 'node:fs';
          import path from 'node:path';
          const root = './node_modules/@img';
          const out = [];
          if (fs.existsSync(root)) {
            for (const name of fs.readdirSync(root)) {
              const p = path.join(root, name, 'package.json');
              if (!fs.existsSync(p)) continue;
              const j = JSON.parse(fs.readFileSync(p, 'utf8'));
              out.push({ name: j.name, version: j.version });
            }
          }
          console.log(JSON.stringify(out.sort((a,b)=>a.name.localeCompare(b.name)), null, 2));
          NODE

      - name: Test image-core
        working-directory: packages/image-core
        shell: bash
        run: |
          set -euo pipefail
          npm test 2>&1 | tee "$RUNNER_TEMP/lp103-evidence/image-core-tests.log"

      - name: Install MCP dependencies and sync core
        working-directory: packages/image-optimizer-mcp
        shell: bash
        run: |
          set -euo pipefail
          npm install --package-lock=false --ignore-scripts --no-audit --no-fund 2>&1 | tee "$RUNNER_TEMP/lp103-evidence/mcp-install.log"
          npm run sync:core 2>&1 | tee "$RUNNER_TEMP/lp103-evidence/sync-core.log"

      - name: Test MCP contracts
        working-directory: packages/image-optimizer-mcp
        shell: bash
        run: |
          set -euo pipefail
          npm test 2>&1 | tee "$RUNNER_TEMP/lp103-evidence/mcp-tests.log"

      - name: Install MCP client
        working-directory: packages/image-optimizer-mcp
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false @modelcontextprotocol/client@^2.0.0 --ignore-scripts --no-audit --no-fund             2>&1 | tee "$RUNNER_TEMP/lp103-evidence/mcp-client-install.log"

      - name: Existing artifact protocol smoke
        working-directory: packages/image-optimizer-mcp
        shell: bash
        run: |
          set -euo pipefail
          node scripts/mcp-artifact-protocol-smoke.mjs             2>&1 | tee "$RUNNER_TEMP/lp103-evidence/mcp-artifact-protocol-smoke.log"

      - name: Existing clean tarball client smoke
        working-directory: packages/image-optimizer-mcp
        shell: bash
        env:
          LP096_PROOF_DIR: ${{ runner.temp }}/lp103-evidence/release-proof
        run: |
          set -euo pipefail
          mkdir -p "$LP096_PROOF_DIR"
          node scripts/release-tarball-client-smoke.mjs             2>&1 | tee "$RUNNER_TEMP/lp103-evidence/release-tarball-client-smoke.log"

      - name: Same-server security reject then successful request
        working-directory: packages/image-optimizer-mcp
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/lp103-recovery.mjs" <<'NODE'
          import assert from 'node:assert/strict';
          import crypto from 'node:crypto';
          import { createRequire } from 'node:module';
          import { writeFile } from 'node:fs/promises';
          import path from 'node:path';
          import { pathToFileURL } from 'node:url';

          const packageRoot = process.cwd();
          const evidenceDir = process.env.RUNNER_TEMP + '/lp103-evidence';
          const req = createRequire(path.join(packageRoot, 'package.json'));
          const { Client } = await import(pathToFileURL(req.resolve('@modelcontextprotocol/client')).href);
          const { StdioClientTransport } = await import(pathToFileURL(req.resolve('@modelcontextprotocol/client/stdio')).href);
          const sharp = (await import(pathToFileURL(req.resolve('sharp')).href)).default;
          const serverPath = path.join(packageRoot, 'src/server.js');

          const raw = Buffer.alloc(480 * 320 * 3);
          for (let y = 0; y < 320; y++) {
            for (let x = 0; x < 480; x++) {
              const i = (y * 480 + x) * 3;
              raw[i] = x % 256;
              raw[i + 1] = y % 256;
              raw[i + 2] = (x + y) % 256;
            }
          }
          const source = sharp(raw, { raw: { width: 480, height: 320, channels: 3 } });
          const jpeg = await source.clone().jpeg({ quality: 96 }).toBuffer();
          const avif = await source.clone().avif({ quality: 60, effort: 2 }).toBuffer();

          const client = new Client({ name: 'lp103-recovery-smoke', version: '1.0.0' });
          const transport = new StdioClientTransport({
            command: process.execPath,
            args: [serverPath],
            cwd: packageRoot
          });

          let blocked = false;
          let blockedDiagnostic = null;
          const sha256 = (b) => crypto.createHash('sha256').update(b).digest('hex');

          try {
            await client.connect(transport);

            try {
              const rejected = await client.callTool({
                name: 'optimize_image',
                arguments: { imageBase64: avif.toString('base64'), policy: { format: 'webp' } }
              });
              blockedDiagnostic = JSON.stringify(rejected);
              blocked = rejected?.isError === true || !rejected?.content?.some(x => x.type === 'resource_link');
            } catch (error) {
              blocked = true;
              blockedDiagnostic = String(error?.stack ?? error);
            }
            assert.equal(blocked, true, 'AVIF input must be rejected');

            const success = await client.callTool({
              name: 'optimize_image',
              arguments: { imageBase64: jpeg.toString('base64'), target: { width: 240 } }
            });
            assert.notEqual(success.isError, true);
            const link = success.content.find(x => x.type === 'resource_link');
            assert.ok(link, 'successful request after rejection must return resource_link');
            const resource = await client.readResource({ uri: link.uri });
            const binary = resource.contents.find(x => typeof x.blob === 'string');
            assert.ok(binary?.blob, 'resources/read must return blob');
            const bytes = Buffer.from(binary.blob, 'base64');
            const meta = await sharp(bytes).metadata();
            const pixels = await sharp(bytes).raw().toBuffer();
            assert.ok(pixels.length > 0, 'full decode after rejection must succeed');
            await writeFile(path.join(evidenceDir, 'post-reject-success.webp'), bytes);

            const avifOut = await client.callTool({
              name: 'optimize_image',
              arguments: {
                imageBase64: jpeg.toString('base64'),
                policy: { format: 'avif', avifQuality: 48, effort: 2, neverIncreaseBytes: false }
              }
            });
            assert.notEqual(avifOut.isError, true);
            const avifLink = avifOut.content.find(x => x.type === 'resource_link');
            assert.ok(avifLink, 'AVIF output must return resource_link');
            const avifResource = await client.readResource({ uri: avifLink.uri });
            const avifBinary = avifResource.contents.find(x => typeof x.blob === 'string');
            assert.ok(avifBinary?.blob);
            const avifBytes = Buffer.from(avifBinary.blob, 'base64');
            const avifMeta = await sharp(avifBytes).metadata();
            const avifPixels = await sharp(avifBytes).raw().toBuffer();
            assert.equal(avifMeta.format, 'heif');
            assert.equal(avifMeta.compression, 'av1');
            assert.ok(avifPixels.length > 0);
            await writeFile(path.join(evidenceDir, 'mcp-avif-output.avif'), avifBytes);

            const report = {
              status: 'PASS',
              blockedInput: {
                format: 'avif',
                blocked,
                diagnostic: blockedDiagnostic
              },
              nextRequest: {
                status: 'PASS',
                mimeType: binary.mimeType,
                bytes: bytes.length,
                sha256: sha256(bytes),
                width: meta.width,
                height: meta.height,
                fullDecode: 'PASS'
              },
              avifOutput: {
                status: 'PASS',
                bytes: avifBytes.length,
                sha256: sha256(avifBytes),
                format: avifMeta.format,
                compression: avifMeta.compression,
                width: avifMeta.width,
                height: avifMeta.height,
                fullDecode: 'PASS'
              }
            };
            await writeFile(path.join(evidenceDir, 'same-server-recovery.json'), JSON.stringify(report, null, 2));
            console.log(JSON.stringify(report, null, 2));
          } finally {
            await client.close().catch(() => {});
          }
          NODE
          node "$RUNNER_TEMP/lp103-recovery.mjs"             2>&1 | tee "$RUNNER_TEMP/lp103-evidence/same-server-recovery.log"

      - name: Pack retained candidate tarball and hash
        working-directory: packages/image-optimizer-mcp
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/lp103-pack"
          npm pack --pack-destination "$RUNNER_TEMP/lp103-pack"             2>&1 | tee "$RUNNER_TEMP/lp103-evidence/npm-pack.log"
          sha256sum "$RUNNER_TEMP"/lp103-pack/*.tgz             | tee "$RUNNER_TEMP/lp103-evidence/tarball-sha256.txt"
          tar -tzf "$RUNNER_TEMP"/lp103-pack/*.tgz             | tee "$RUNNER_TEMP/lp103-evidence/tarball-contents.txt"

      - name: Clean install retained tarball and capture dependency tree
        shell: bash
        run: |
          set -euo pipefail
          CLEAN="$RUNNER_TEMP/lp103-clean"
          mkdir -p "$CLEAN"
          cd "$CLEAN"
          npm init -y >/dev/null
          npm install "$RUNNER_TEMP"/lp103-pack/*.tgz @modelcontextprotocol/client@^2.0.0 --package-lock=false --no-audit --no-fund             2>&1 | tee "$RUNNER_TEMP/lp103-evidence/clean-install.log"
          npm ls sharp @img/sharp-linux-x64 @img/sharp-libvips-linux-x64 --all --json             | tee "$RUNNER_TEMP/lp103-evidence/clean-install-native.json"
          node --input-type=module <<'NODE' | tee "$RUNNER_TEMP/lp103-evidence/clean-install-sharp-versions.json"
          import fs from 'node:fs';
          import sharp from 'sharp';
          const pkg = JSON.parse(fs.readFileSync('./node_modules/sharp/package.json', 'utf8'));
          console.log(JSON.stringify({ sharpPackageVersion: pkg.version, sharpVersions: sharp.versions }, null, 2));
          if (pkg.version !== '0.35.4') process.exit(31);
          NODE

      - name: Upload exact LP-103 evidence
        uses: actions/upload-artifact@v4
        with:
          name: lp103-exact-runtime-evidence-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/lp103-evidence
            ${{ runner.temp }}/lp103-pack/*.tgz
          if-no-files-found: error
          retention-days: 30
