name: LP-045 Validate Extensions Locales

on:
  push:
    branches:
      - i18n/LP-045-extensions-locales

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Build
        run: npm run build
      - name: Validate 8 Extensions locales
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re, html

          cfg = {
            "en": (Path("dist/extensions/index.html"), "en", "https://layerporter.com/extensions/", "Chrome extensions for downloading and converting images", "Pinterest Downloader", "Picture Converter", "/pinterest-downloader/"),
            "ru": (Path("dist/ru/extensions/index.html"), "ru", "https://layerporter.com/ru/extensions/", "Расширения для Chrome для скачивания и конвертации изображений", "Скачать фото с Пинтерест", "Конвертер картинок", "/ru/pinterest-downloader/"),
            "de": (Path("dist/de/extensions/index.html"), "de", "https://layerporter.com/de/extensions/", "Chrome-Erweiterungen zum Herunterladen und Konvertieren von Bildern", "Pinterest Download", "Bildkonverter", "/de/pinterest-downloader/"),
            "es": (Path("dist/es/extensions/index.html"), "es", "https://layerporter.com/es/extensions/", "Extensiones de Chrome para descargar y convertir imágenes", "Descargar Pinterest", "Conversor de Imágenes", "/es/pinterest-downloader/"),
            "fr": (Path("dist/fr/extensions/index.html"), "fr", "https://layerporter.com/fr/extensions/", "Extensions Chrome pour télécharger et convertir des images", "Télécharger Pinterest", "Convertisseur d'images", "/fr/pinterest-downloader/"),
            "pt-br": (Path("dist/pt-br/extensions/index.html"), "pt-BR", "https://layerporter.com/pt-br/extensions/", "Extensões para Chrome para baixar e converter imagens", "Baixar Pinterest", "Conversor de Imagens", "/pt-br/pinterest-downloader/"),
            "ja": (Path("dist/ja/extensions/index.html"), "ja", "https://layerporter.com/ja/extensions/", "画像のダウンロードと変換に使える Chrome 拡張機能", "ピンタレスト ダウンロード", "画像コンバーター", "/ja/pinterest-downloader/"),
            "zh-cn": (Path("dist/zh-cn/extensions/index.html"), "zh-CN", "https://layerporter.com/zh-cn/extensions/", "用于下载和转换图片的 Chrome 扩展程序", "Pinterest 下载", "图片转换器", "/zh-cn/pinterest-downloader/"),
          }
          alts = {
            "en":"https://layerporter.com/extensions/",
            "ru":"https://layerporter.com/ru/extensions/",
            "de":"https://layerporter.com/de/extensions/",
            "es":"https://layerporter.com/es/extensions/",
            "fr":"https://layerporter.com/fr/extensions/",
            "pt-BR":"https://layerporter.com/pt-br/extensions/",
            "ja":"https://layerporter.com/ja/extensions/",
            "zh-CN":"https://layerporter.com/zh-cn/extensions/",
            "x-default":"https://layerporter.com/extensions/",
          }

          forbidden = [
            "Two focused tools",
            "Add to Chrome",
            "View details",
            "Pick an image or video",
            "Find all images on this page",
            "Drag &amp; drop an image here",
            "Processed locally. Nothing is uploaded.",
            "Local engine",
          ]

          for slug,(path,lang,canonical,h1,pd,pc,pd_detail) in cfg.items():
            assert path.exists(), f"missing {path}"
            s=path.read_text("utf-8")
            assert f'<html lang="{lang}">' in s, (slug, "lang")
            assert f'<link rel="canonical" href="{canonical}">' in s, (slug, "canonical")
            assert f'<h1>{html.escape(h1)}</h1>' in s, (slug, "h1")
            assert pd in s, (slug, "pd name")
            assert pc in s, (slug, "pc name")
            assert s.count('class="extension-product"') == 2, (slug, "product count")
            assert s.count("Add to Chrome") == 2 if slug=="en" else "Add to Chrome" not in s, (slug, "cta")
            assert f'href="{pd_detail}"' in s, (slug, "localized pinterest detail")
            assert 'href="/picture-converter/"' in s, (slug, "picture converter fallback")
            assert "nmpahchhmcdejmfcmkphnbhckmlhhnon" in s, (slug, "pd store")
            assert "ooiklbnjmhbcfnllkgjahadblibecgfj" in s, (slug, "pc store")
            assert "images.unsplash.com" not in s, (slug, "unsplash")
            assert "/og/downloader.png" not in s, (slug, "heavy og")
            assert "/images/home/fashion-reference-320.webp" in s
            for hreflang,href in alts.items():
              assert f'hreflang="{hreflang}" href="{href}"' in s, (slug, hreflang)
            if slug != "en":
              for phrase in forbidden:
                assert phrase not in s, (slug, "english leakage", phrase)

            imgs=re.findall(r'<img\b[^>]*>', s)
            assert imgs
            for img in imgs:
              src=re.search(r'src="([^"]+)"',img)
              assert src and src.group(1).startswith("/"), (slug,img)
              if "/images/home/" in src.group(1):
                assert src.group(1).endswith(".webp")
                assert 'loading="lazy"' in img
                assert 'decoding="async"' in img
                assert re.search(r'width="\d+"',img)
                assert re.search(r'height="\d+"',img)

          sitemap=Path("dist/sitemap.xml").read_text("utf-8")
          for _,href in alts.items():
            if href.endswith("/extensions/") and "x-default" not in href:
              pass
          for path in [
            "/extensions/","/ru/extensions/","/de/extensions/","/es/extensions/",
            "/fr/extensions/","/pt-br/extensions/","/ja/extensions/","/zh-cn/extensions/"
          ]:
            assert f"<loc>https://layerporter.com{path}</loc>" in sitemap, path

          for slug in ["ru","de","es","fr","pt-br","ja","zh-cn"]:
            home=Path(f"dist/{slug}/index.html").read_text("utf-8")
            assert home.count(f'href="/{slug}/extensions/"') >= 4, (slug,"home links")
            assert 'href="/extensions/"' not in home, (slug,"old EN extensions link still on home")

          print("LP-045 ALL 8 EXTENSIONS LOCALES PASS")
          PY
