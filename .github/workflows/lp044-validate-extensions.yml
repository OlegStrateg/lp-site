name: LP-044 Validate Extensions Hub

on:
  push:
    branches:
      - cro/LP-044-extensions-hub

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Build
        run: npm run build
      - name: Validate Extensions hub
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          hub=Path("dist/extensions/index.html").read_text("utf-8")
          pc=Path("dist/picture-converter/index.html").read_text("utf-8")
          sitemap=Path("dist/sitemap.xml").read_text("utf-8")
          redirects=Path("dist/_redirects").read_text("utf-8")

          assert "<h1>Chrome extensions for downloading and converting images</h1>" in hub
          assert hub.count('class="extension-product"') == 2
          assert "Pinterest Downloader" in hub
          assert "Picture Converter" in hub
          assert "Site to Canva" not in hub
          assert "PSD Export" not in hub
          assert hub.count("Add to Chrome") == 2
          assert hub.count("View details") == 2
          assert 'href="/pinterest-downloader/"' in hub
          assert 'href="/picture-converter/"' in hub
          assert "nmpahchhmcdejmfcmkphnbhckmlhhnon" in hub
          assert "ooiklbnjmhbcfnllkgjahadblibecgfj" in hub
          assert "images.unsplash.com" not in hub
          assert "/og/downloader.png" not in hub

          imgs=re.findall(r'<img\b[^>]*>', hub)
          assert imgs, "No images found"
          for img in imgs:
              src=re.search(r'src="([^"]+)"',img)
              assert src, img
              url=src.group(1)
              assert url.startswith("/"), url
              if "/images/home/" in url:
                  assert url.endswith(".webp"), url
                  assert 'loading="lazy"' in img, img
                  assert 'decoding="async"' in img, img
                  assert re.search(r'width="\d+"', img), img
                  assert re.search(r'height="\d+"', img), img

          assert "Picture Converter for Chrome" in pc
          assert "ooiklbnjmhbcfnllkgjahadblibecgfj" in pc
          assert "oegpbmdpckfdgodnkdnoggedamfflfcl" not in pc
          assert "https://layerporter.com/picture-converter/" in pc

          assert "<loc>https://layerporter.com/picture-converter/</loc>" in sitemap
          assert "<loc>https://layerporter.com/extensions/picture-converter/</loc>" not in sitemap
          assert "/extensions/picture-converter/ /picture-converter/ 301" in redirects

          css=Path("dist/extensions-hub.css")
          assert css.exists() and css.stat().st_size > 5000
          print("LP-044 BUILD VALIDATION PASS")
          PY
