name: LP-078 Public MCP Pages Verify

on:
  push:
    branches:
      - feat/LP-078-image-optimizer-mcp-core
      - feat/LP-081-session-2-gate
      - feat/LP-091-final-pareto-release-gate
      - integration/LP-092-page-optimizer-current-master
    paths:
      - 'src/pages/mcp/**'
      - 'src/pages/docs/mcp/**'
      - 'src/copy/website-image-optimizer-mcp*.md'
      - 'packages/image-optimizer-mcp/README.md'
      - '.github/workflows/page-optimizer-public-verify.yml'
  pull_request:
    paths:
      - 'src/pages/mcp/**'
      - 'src/pages/docs/mcp/**'
      - 'src/copy/website-image-optimizer-mcp*.md'
      - 'packages/image-optimizer-mcp/README.md'
      - '.github/workflows/page-optimizer-public-verify.yml'

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: 'npm'
      - name: Install site dependencies
        run: npm ci --no-audit --no-fund
      - name: Build Astro site
        run: npx astro build
      - name: Verify canonical public pages
        run: |
          test -f dist/mcp/website-image-optimizer/index.html
          test -f dist/docs/mcp/website-image-optimizer/index.html
          grep -q 'Website Image Optimizer MCP' dist/mcp/website-image-optimizer/index.html
          grep -q 'technical candidate' dist/docs/mcp/website-image-optimizer/index.html
          grep -q 'application/ld+json' dist/mcp/website-image-optimizer/index.html
