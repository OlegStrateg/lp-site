name: LayerPorter LP-123 preview (isolated, no production)
on:
  push:
    branches:
      - feat/LP-123-ai-image-edit-guarded
permissions:
  contents: read
  deployments: write
jobs:
  deploy_preview:
    if: github.ref == 'refs/heads/feat/LP-123-ai-image-edit-guarded'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Dependencies
        run: npm ci --no-audit --no-fund
      - name: AI editor tests
        run: node --test scripts/test-ai-image-security.mjs scripts/test-ai-image-editor.mjs
      - name: Build entire site with existing verification
        run: npm run build
      - name: Force preview indexing off
        shell: bash
        run: |
          printf '\n/*\n  X-Robots-Tag: noindex, nofollow, noarchive\n' >> dist/_headers
      - name: Check Cloudflare credentials configured
        env:
          CF_TOKEN_EXISTS: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
          CF_ACCOUNT_EXISTS: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: |
          if [ "$CF_TOKEN_EXISTS" != "true" ] || [ "$CF_ACCOUNT_EXISTS" != "true" ]; then
            echo "::error::Cloudflare GitHub Actions credentials are not configured."
            exit 1
          fi
      - name: Audit Cloudflare preview bindings without revealing secret values
        continue-on-error: true
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const endpoint='https://api.cloudflare.com/client/v4/accounts/'+process.env.CF_ACCOUNT+'/pages/projects/layerporter';
          const response=await fetch(endpoint,{headers:{Authorization:'Bearer '+process.env.CF_TOKEN}});
          if(!response.ok){console.log('Cloudflare bindings introspection unavailable: HTTP '+response.status);process.exit(0)}
          const data=await response.json();
          if(!data.success){console.log('Cloudflare bindings introspection unavailable');process.exit(0)}
          const names=['AI_IMAGE_API_KEY','AI_IMAGE_EDIT_URL','AI_IMAGE_MODEL','AI_IMAGE_OWNER_PASSWORD','AI_IMAGE_PREVIEW_ENABLED','AI_IMAGE_PREVIEW_OWNER_ONLY'];
          const configs=data.result?.deployment_configs||{};
          for(const environment of ['preview','production']){
            const keys=configs[environment]?.env_vars||{};
            console.log(environment+' configured names (values NEVER printed): '+names.map(name=>name+'='+(Object.hasOwn(keys,name)?'present':'missing')).join(', '));
          }
          NODE
      - name: Configure initial nonsecret preview-only API settings
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const url='https://api.cloudflare.com/client/v4/accounts/'+process.env.CF_ACCOUNT+'/pages/projects/layerporter';
          const headers={Authorization:'Bearer '+process.env.CF_TOKEN,'Content-Type':'application/json'};
          const read=await fetch(url,{headers});
          if(!read.ok)throw Error('Cannot read Cloudflare project settings: '+read.status);
          const current=(await read.json()).result;
          const preview=current?.deployment_configs?.preview?.env_vars||{};
          if(Object.keys(preview).length){
            console.log('Preview already has environment bindings; skipping automatic changes to protect existing secrets.');
          }else{
            const vars={
              AI_IMAGE_EDIT_URL:{type:'plain_text',value:'https://apimaster.ai/v1/images/edits'},
              AI_IMAGE_MODEL:{type:'plain_text',value:'gpt-image-2'},
              AI_IMAGE_PREVIEW_ENABLED:{type:'plain_text',value:'yes'},
              AI_IMAGE_PREVIEW_OWNER_ONLY:{type:'plain_text',value:'yes'}
            };
            const change=await fetch(url,{method:'PATCH',headers,body:JSON.stringify({deployment_configs:{preview:{env_vars:vars}}})});
            if(!change.ok)throw Error('Cloudflare preview config was rejected: '+change.status);
            const updated=await change.json();
            if(!updated.success)throw Error('Cloudflare rejected preview config');
            console.log('Configured preview-only endpoint, model and owner-only flags. No key or password touched.');
          }
          NODE
      - name: Check whether encrypted production token supports secure server-side transfer
        continue-on-error: true
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const url='https://api.cloudflare.com/client/v4/accounts/'+process.env.CF_ACCOUNT+'/pages/projects/layerporter';
          const headers={Authorization:'Bearer '+process.env.CF_TOKEN,'Content-Type':'application/json'};
          const r=await fetch(url,{headers});
          if(!r.ok)process.exit(0);
          const info=(await r.json()).result;
          const preview=info.deployment_configs?.preview?.env_vars||{};
          const token=info.deployment_configs?.production?.env_vars?.AI_IMAGE_API_KEY;
          if(preview.AI_IMAGE_API_KEY){console.log('Preview AI key already configured.');process.exit(0);}
          const v=token?.value;
          if(token?.type!=='secret_text'||typeof v!=='string'||v.length<32||/^\*+$/.test(v)||v===''){
            console.log('Production secret is encrypted/unreadable via API; transfer cannot be automated. No token value logged.');
            process.exit(0);
          }
          const allowed=['AI_IMAGE_EDIT_URL','AI_IMAGE_MODEL','AI_IMAGE_PREVIEW_ENABLED','AI_IMAGE_PREVIEW_OWNER_ONLY'];
          if(Object.keys(preview).some(k=>!allowed.includes(k))){
            console.log('Preview contains other settings; automated transfer skipped to avoid overrides.');
            process.exit(0);
          }
          const vars={...Object.fromEntries(allowed.map(k=>[k,preview[k]]).filter(([,v])=>v?.type==='plain_text')),
            AI_IMAGE_API_KEY:{type:'secret_text',value:v}};
          const response=await fetch(url,{method:'PATCH',headers,body:JSON.stringify({deployment_configs:{preview:{env_vars:vars}}})});
          if(response.ok&&(await response.json()).success)console.log('Copied secret directly between Cloudflare environments without revealing its value.');
          else console.log('Cloudflare rejected server-side transfer. Use Preview secret settings.');
          NODE
      - name: Deploy only to Cloudflare Pages preview
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=layerporter --branch=lp-123-ai-preview --commit-hash=${{ github.sha }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify deployed editor and non-production URL
        shell: bash
        env:
          ALIAS: ${{ steps.deploy.outputs.pages-deployment-alias-url }}
        run: |
          set -euo pipefail
          if [ "$ALIAS" != "https://lp-123-ai-preview.layerporter.pages.dev" ]; then
            echo "::error::Unexpected preview alias '$ALIAS'; refusing to claim deployment is verified"
            exit 1
          fi
          for path in /tools/ai-image-editor/ /ru/tools/ai-image-editor/; do
            curl -fLsS --max-time 30 --retry 4 --retry-delay 3 "$ALIAS$path" -o /tmp/editor.html
            grep -Fq 'id="ai-photo-panel"' /tmp/editor.html
            grep -Fq 'id="ai-photo-prompt"' /tmp/editor.html
            grep -Fq 'id="ai-photo-history"' /tmp/editor.html
            grep -Fq 'id="ai-photo-file"' /tmp/editor.html
            ! grep -Fq 'id="resize-image-tool"' /tmp/editor.html
          done
          curl -fLsS --max-time 30 "$ALIAS/tools/resize-image/" -o /tmp/resize.html
          grep -Fq 'id="resize-image-tool"' /tmp/resize.html
          ! grep -Fq 'id="ai-photo-panel"' /tmp/resize.html
          curl -fsS --max-time 30 "$ALIAS/api/ai-image-edit" -o /tmp/editor-status.json
          node -e "const x=require('/tmp/editor-status.json');if(x.available!==false)process.exit(1)"
          printf 'Verified preview: %s/tools/resize-image/\n' "$ALIAS"
          echo "### LP-123 preview (AI spend disabled)" >> "$GITHUB_STEP_SUMMARY"
          echo "$ALIAS/tools/ai-image-editor/" >> "$GITHUB_STEP_SUMMARY"
