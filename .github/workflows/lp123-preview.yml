name: LayerPorter LP-123 preview (isolated, no production)
# Publish only by deliberate manual dispatch after full acceptance tests.
# No automatic deployment on push or PR.
on:
  workflow_dispatch:
permissions:
  contents: read
  deployments: write
jobs:
  deploy_preview:
    if: github.ref == 'refs/heads/feat/LP-123-ai-image-edit-guarded'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Dependencies
        run: npm ci --no-audit --no-fund
      - name: AI editor tests
        run: node --test scripts/test-ai-image-security.mjs scripts/test-ai-image-editor.mjs
      - name: Build entire site with existing verification
        run: npm run build
      - name: Force preview indexing off
        shell: bash
        run: |
          printf '\n/*\n  X-Robots-Tag: noindex, nofollow, noarchive\n' >> dist/_headers
      - name: Check Cloudflare credentials configured
        env:
          CF_TOKEN_EXISTS: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
          CF_ACCOUNT_EXISTS: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: |
          if [ "$CF_TOKEN_EXISTS" != "true" ] || [ "$CF_ACCOUNT_EXISTS" != "true" ]; then
            echo "::error::Cloudflare GitHub Actions credentials are not configured."
            exit 1
          fi
      - name: Deploy only to Cloudflare Pages preview
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=layerporter --branch=lp-123-ai-preview --commit-hash=${{ github.sha }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
      - name: Audit Cloudflare preview bindings without revealing secret values
        continue-on-error: true
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const endpoint='https://api.cloudflare.com/client/v4/accounts/'+process.env.CF_ACCOUNT+'/pages/projects/layerporter';
          const response=await fetch(endpoint,{headers:{Authorization:'Bearer '+process.env.CF_TOKEN}});
          if(!response.ok){console.log('Cloudflare bindings introspection unavailable: HTTP '+response.status);process.exit(0)}
          const data=await response.json();
          if(!data.success){console.log('Cloudflare bindings introspection unavailable');process.exit(0)}
          const names=['AI_IMAGE_API_KEY','AI_IMAGE_EDIT_URL','AI_IMAGE_MODEL','AI_IMAGE_OWNER_PASSWORD','AI_IMAGE_PREVIEW_ENABLED','AI_IMAGE_PREVIEW_OWNER_ONLY'];
          const configs=data.result?.deployment_configs||{};
          for(const environment of ['preview','production']){
            const keys=configs[environment]?.env_vars||{};
            console.log(environment+' configured names (values NEVER printed): '+names.map(name=>name+'='+(Object.hasOwn(keys,name)?'present':'missing')).join(', '));
          }
          NODE
      - name: Verify deployed editor and non-production URL
        shell: bash
        env:
          ALIAS: ${{ steps.deploy.outputs.pages-deployment-alias-url }}
        run: |
          set -euo pipefail
          if [ "$ALIAS" != "https://lp-123-ai-preview.layerporter.pages.dev" ]; then
            echo "::error::Unexpected preview alias '$ALIAS'; refusing to claim deployment is verified"
            exit 1
          fi
          for path in /tools/ai-image-editor/ /ru/tools/ai-image-editor/; do
            curl -fLsS --max-time 30 --retry 4 --retry-delay 3 "$ALIAS$path" -o /tmp/editor.html
            grep -Fq 'id="ai-photo-panel"' /tmp/editor.html
            grep -Fq 'id="ai-photo-prompt"' /tmp/editor.html
            grep -Fq 'id="ai-photo-history"' /tmp/editor.html
            grep -Fq 'id="ai-photo-file"' /tmp/editor.html
            ! grep -Fq 'id="resize-image-tool"' /tmp/editor.html
          done
          curl -fLsS --max-time 30 "$ALIAS/tools/resize-image/" -o /tmp/resize.html
          grep -Fq 'id="resize-image-tool"' /tmp/resize.html
          ! grep -Fq 'id="ai-photo-panel"' /tmp/resize.html
          curl -fsS --max-time 30 "$ALIAS/api/ai-image-edit" -o /tmp/editor-status.json
          node -e "const x=require('/tmp/editor-status.json');if(x.available!==false)process.exit(1)"
          printf 'Verified preview: %s/tools/resize-image/\n' "$ALIAS"
          echo "### LP-123 preview (AI spend disabled)" >> "$GITHUB_STEP_SUMMARY"
          echo "$ALIAS/tools/ai-image-editor/" >> "$GITHUB_STEP_SUMMARY"
