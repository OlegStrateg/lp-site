name: LP-047 Validate Extensions CSS Cache Bust

on:
  push:
    branches:
      - fix/LP-047-extensions-css-cache

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Validate cache-busted CSS
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          pages=[
            Path("dist/extensions/index.html"),
            Path("dist/ru/extensions/index.html"),
            Path("dist/de/extensions/index.html"),
            Path("dist/es/extensions/index.html"),
            Path("dist/fr/extensions/index.html"),
            Path("dist/pt-br/extensions/index.html"),
            Path("dist/ja/extensions/index.html"),
            Path("dist/zh-cn/extensions/index.html"),
          ]
          for p in pages:
            s=p.read_text("utf-8")
            assert 'href="/extensions-hub-v2.css"' in s, p
            assert 'extensions-locale-menu' in s, p
            assert 'extensions-locale-options' in s, p
            assert 'href="/extensions-hub.css"' not in s, p
          css=Path("dist/extensions-hub-v2.css").read_text("utf-8")
          assert ".extensions-locale-menu{position:relative" in css
          assert ".extensions-locale-options{position:absolute" in css
          assert "display:flex" in css
          print("LP-047 CACHE-BUST PASS")
          PY
