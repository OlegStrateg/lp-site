name: Deploy Fashion Radar to Cloudflare

on:
  push:
    branches:
      - deploy/fashion-radar-cloudflare
    paths:
      - 'worker/fashion-radar/**'
      - 'wrangler-fashion-radar.toml'
      - '.github/workflows/fashion-radar-cloudflare-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Syntax check
        run: |
          node --check worker/fashion-radar/data.js
          node --check worker/fashion-radar/parser.js
          node --check worker/fashion-radar/ui.js
          node --check worker/fashion-radar/index.js

      - name: Deploy Fashion Radar Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@3.90.0 deploy --config wrangler-fashion-radar.toml

      - name: Verify public health and UI
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..24}; do
            if curl -fsS --max-time 20 https://radar.summarizers.app/health -o /tmp/radar-health.json \
              && grep -Fq '"ok":true' /tmp/radar-health.json \
              && curl -fsS --max-time 20 https://radar.summarizers.app/ -o /tmp/radar.html \
              && grep -Fq 'Fashion Radar' /tmp/radar.html; then
              cat /tmp/radar-health.json
              echo
              echo "Fashion Radar UI is live"
              exit 0
            fi
            sleep 5
          done
          echo "Fashion Radar public verification failed"
          exit 1

      - name: Verify one live collection
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 60 \
            -H 'content-type: application/json' \
            --data '{"target_geo":"RU"}' \
            https://radar.summarizers.app/api/run \
            -o /tmp/radar-run.json
          node - <<'NODE'
          const fs = require('fs');
          const data = JSON.parse(fs.readFileSync('/tmp/radar-run.json', 'utf8'));
          if (data.ok !== true) throw new Error('run not ok');
          if (!data.summary || data.summary.ok_sources < 1) throw new Error('no live sources');
          if (!Array.isArray(data.collectors) || data.collectors.length < 10) throw new Error('collector panel incomplete');
          console.log(JSON.stringify({
            status: data.status,
            ok_sources: data.summary.ok_sources,
            failed_sources: data.summary.failed_sources,
            raw_records: data.summary.raw_records,
            candidates: data.candidates.length
          }));
          NODE
