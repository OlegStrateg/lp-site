name: Pull Request Build

on:
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: AI image security unit tests
        run: node --test scripts/test-ai-image-security.mjs scripts/test-ai-image-editor.mjs

      - name: Test deployment-readiness guard (no external credentials)
        run: node --test scripts/preflight-ai-image-preview.test.mjs

      - name: Build and static gates
        run: npm run build
      - name: Install isolated Chromium test dependencies
        run: |
          npm install --no-save --no-package-lock --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Real Chromium UI regression (offline mock AI)
        run: node scripts/test-ai-image-browser.mjs
      - name: Upload AI editor Chromium screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lp123-chromium-evidence
          path: artifacts/ai-image-editor/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload meme editor evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: meme-editor-evidence
          path: artifacts/meme-editor/
          if-no-files-found: ignore
          retention-days: 7
