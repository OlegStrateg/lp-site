name: Pull Request Build

on:
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build and static gates
        run: npm run build

      - name: Upload meme editor evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: meme-editor-evidence
          path: artifacts/meme-editor/
          if-no-files-found: ignore
          retention-days: 7
