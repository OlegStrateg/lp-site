name: Live fashion embedding inference lab

on:
  push:
    branches:
      - lab/vendor-trend-tools-smoke
    paths:
      - '.github/workflows/live-fashion-embedding-inference.yml'
  workflow_dispatch:

jobs:
  fashion_models:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Fetch exact vendor reference
        run: |
          git clone https://github.com/marqo-ai/marqo-FashionCLIP.git fashionclip
          git -C fashionclip checkout d0b3bdfb62fb4964537cb582e76d6ddab0be8450
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install minimal inference dependencies
        run: |
          python -m pip install --upgrade pip >/dev/null
          python -m pip install torch torchvision transformers pillow curl_cffi huggingface_hub open_clip_torch >/dev/null
      - name: Fetch real Instagram fashion image
        run: |
          python - <<'PY'
          import re,html
          from curl_cffi import requests
          from pathlib import Path
          from PIL import Image
          from io import BytesIO

          url="https://www.instagram.com/reel/C6w6f49Asga/"
          s=requests.Session(impersonate="chrome146")
          r=s.get(url,headers={"Accept":"text/html,application/xhtml+xml","Accept-Language":"en-US,en;q=0.9"})
          print("page_status=",r.status_code,"bytes=",len(r.content))
          text=r.text
          pats=[
            r'<meta[^>]+property=["\']og:image["\'][^>]+content=["\']([^"\']+)',
            r'<meta[^>]+content=["\']([^"\']+)["\'][^>]+property=["\']og:image["\']'
          ]
          img_url=None
          for p in pats:
              m=re.search(p,text,re.I)
              if m:
                  img_url=html.unescape(m.group(1))
                  break
          print("og_image_found=",bool(img_url))
          if not img_url:
              raise SystemExit("No og:image")
          ir=s.get(img_url,headers={"Referer":"https://www.instagram.com/","User-Agent":"Mozilla/5.0"})
          print("image_status=",ir.status_code,"bytes=",len(ir.content))
          im=Image.open(BytesIO(ir.content)).convert("RGB")
          print("image_size=",im.size)
          im.save("live-fashion.jpg",quality=95)
          PY
      - name: Run FashionCLIP and FashionSigLIP through vendor-documented OpenCLIP path
        run: |
          python - <<'PY'
          import gc,json,torch,open_clip
          from PIL import Image
          from huggingface_hub import HfApi

          raw_image=Image.open("live-fashion.jpg").convert("RGB")
          labels=["a bodysuit","a top","a dress","a skirt","jeans","pants","shoes","a bag","a jacket"]
          models=["Marqo/marqo-fashionCLIP","Marqo/marqo-fashionSigLIP"]
          api=HfApi()
          all_results={}
          for name in models:
              sha=api.model_info(name).sha
              print("MODEL",name,"RESOLVED_REVISION",sha)
              spec="hf-hub:"+name
              model,_,preprocess=open_clip.create_model_and_transforms(spec)
              tokenizer=open_clip.get_tokenizer(spec)
              image=preprocess(raw_image).unsqueeze(0)
              text=tokenizer(labels)
              with torch.no_grad():
                  image_features=model.encode_image(image,normalize=True)
                  text_features=model.encode_text(text,normalize=True)
                  probs=(100.0*image_features@text_features.T).softmax(dim=-1)[0].cpu().tolist()
              ranked=sorted(zip(labels,probs),key=lambda x:x[1],reverse=True)
              all_results[name]={"resolved_revision":sha,"ranking":ranked}
              print("RANKING",name,json.dumps(ranked,ensure_ascii=False))
              del model,image,text,image_features,text_features
              gc.collect()
          open("fashion-model-results.json","w").write(json.dumps(all_results,ensure_ascii=False,indent=2))
          PY
