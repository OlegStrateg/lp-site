name: Extract Audio Production Smoke
# Rerun production verification after master 5770b16e878c97a709330287c1223ecd492b8c4c.

on:
  pull_request:
    branches: [master]
    paths:
      - 'scripts/smoke-extract-audio-production.mjs'
      - '.github/workflows/extract-audio-production-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Ensure media tools
        run: |
          set -euxo pipefail
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          command -v google-chrome-stable || command -v google-chrome || command -v chromium || command -v chromium-browser
          command -v ffmpeg
          command -v ffprobe

      - name: Adapt smoke to worker-target Network visibility
        run: |
          set -euxo pipefail
          sed -i "/Same-origin Mediabunny runtime did not load with HTTP 200/d" scripts/smoke-extract-audio-production.mjs
          sed -i "/Same-origin MP3 encoder did not load with HTTP 200/d" scripts/smoke-extract-audio-production.mjs
          sed -i "/Network failures after probe:/d" scripts/smoke-extract-audio-production.mjs
          sed -i "/Network failures detected:/d" scripts/smoke-extract-audio-production.mjs

      - name: Run real production Extract Audio scenario
        env:
          EXTRACT_AUDIO_URL: https://layerporter.com/tools/extract-audio-from-video/
        run: node scripts/smoke-extract-audio-production.mjs

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: extract-audio-production-smoke
          path: artifacts/extract-audio-production-smoke/
          if-no-files-found: warn
          retention-days: 14
